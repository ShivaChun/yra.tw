<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>靈感問路站 | 擲筊・三元牌・宇宙指引</title>

    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- GSAP 3 (Cinematic Timeline Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- Three.js ES Module Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <!-- Digital Divination Design System -->
    <link rel="stylesheet" href="./styles/divination.css">
</head>
<body>
    <!-- 全站單一共享 WebGL 沉浸舞台 -->
    <canvas id="webgl-stage" aria-hidden="true"></canvas>
    <div class="grain-overlay" aria-hidden="true"></div>
    <div class="vignette-overlay" aria-hidden="true"></div>

    <!-- React 儀式互動層 -->
    <div id="root"></div>

    <!-- 3D 舞台與物理引擎模組 -->
    <script type="module" src="./js/stage-manager.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icons = {
            Moon: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                </svg>
            ),
            Cards: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
                    <rect width="15" height="20" x="4.5" y="2" rx="2"/>
                    <path d="M9 7h6"/><path d="M9 12h6"/><path d="M12 16.5v.01"/>
                </svg>
            ),
            Compass: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="9.5"/>
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
                </svg>
            ),
            VolumeOn: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                </svg>
            ),
            VolumeOff: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <line x1="22" y1="9" x2="16" y2="15"/>
                    <line x1="16" y1="9" x2="22" y2="15"/>
                </svg>
            )
        };

        const ROMAN = ['I', 'II', 'III'];

        // =====================================================================
        // 1. 擲筊元件 (MoonBlocks) — 嚴格保留原有隨機演算與 7 狀態 FSM
        //    IDLE → PREPARING → THROWING → COLLISION → SETTLING → REVEAL → RESULT
        // =====================================================================
        const BLOCK_PHASE_LABELS = {
            IDLE: '',
            PREPARING: '合 掌 聚 氣',
            THROWING: '擲 出 問 卜',
            COLLISION: '落 地 反 彈',
            SETTLING: '靈 機 落 定',
            REVEAL: '神 諭 揭 曉',
            RESULT: ''
        };

        const MoonBlocks = () => {
            const [phase, setPhase] = useState("IDLE");
            const [blocks, setBlocks] = useState([0, 0]);
            const [resultText, setResultText] = useState("");
            const [resultDesc, setResultDesc] = useState("");
            const [fallbackMode, setFallbackMode] = useState(false);

            const sessionRef = useRef(0);
            const fallbackTimerRef = useRef(null);
            const isBusy = phase !== "IDLE" && phase !== "RESULT";

            // 元件卸載或切頁時乾淨中斷動畫並復原 3D 場景
            useEffect(() => {
                if (window.DivinationStage && !window.DivinationStage.isWebGLAvailable()) {
                    setFallbackMode(true);
                }
                return () => {
                    sessionRef.current++;
                    if (fallbackTimerRef.current) clearTimeout(fallbackTimerRef.current);
                    if (window.DivinationStage && typeof window.DivinationStage.resetMoonBlocks === 'function') {
                        window.DivinationStage.resetMoonBlocks();
                    }
                };
            }, []);

            const toss = () => {
                // 嚴格防止動畫進行期間重複觸發
                if (isBusy) return;

                const mySession = ++sessionRef.current;
                setPhase("PREPARING");
                setResultText("");
                setResultDesc("");

                // 既有核心隨機演算與判斷邏輯（嚴格保留，絕不更動）
                const b1 = Math.random() > 0.5 ? 1 : 0;
                const b2 = Math.random() > 0.5 ? 1 : 0;
                const sum = b1 + b2;
                let text = "";
                let desc = "";

                if (sum === 1) {
                    text = "聖筊";
                    desc = "所願可成，心誠則靈。";
                } else if (sum === 2) {
                    text = "笑筊";
                    desc = "機緣未定，或再三思。";
                } else {
                    text = "陰筊";
                    desc = "時機未到，靜候佳音。";
                }

                const onComplete = () => {
                    if (sessionRef.current !== mySession) return;
                    setBlocks([b1, b2]);
                    setResultText(text);
                    setResultDesc(desc);
                    setPhase("RESULT");
                };

                const onPhaseChange = (nextPhase) => {
                    if (sessionRef.current !== mySession) return;
                    setPhase(nextPhase);
                };

                const started3D =
                    window.DivinationStage &&
                    typeof window.DivinationStage.throwMoonBlocks === 'function' &&
                    window.DivinationStage.throwMoonBlocks(b1, b2, onComplete, onPhaseChange);

                // WebGL 載入失敗時的安全降級方案，保留完整原有功能
                if (!started3D) {
                    setFallbackMode(true);
                    fallbackTimerRef.current = setTimeout(() => {
                        if (sessionRef.current !== mySession) return;
                        setPhase("THROWING");
                        fallbackTimerRef.current = setTimeout(onComplete, 700);
                    }, 450);
                }
            };

            const resetBlocks = () => {
                sessionRef.current++;
                if (fallbackTimerRef.current) clearTimeout(fallbackTimerRef.current);
                setPhase("IDLE");
                setResultText("");
                setResultDesc("");
                if (window.DivinationStage && typeof window.DivinationStage.resetMoonBlocks === 'function') {
                    window.DivinationStage.resetMoonBlocks();
                }
            };

            const faceLabel = (val) => (val === 1 ? "陽 · 平面" : "陰 · 凸面");
            const resultToneClass =
                resultText === "聖筊"
                    ? "text-[#e6cca0]"
                    : resultText === "笑筊"
                    ? "text-[#cfd8e3]"
                    : "text-[#d6766a]";

            return (
                <div
                    className="flex-1 flex flex-col items-center justify-between w-full max-w-3xl mx-auto px-4 pt-6 pb-10 min-h-[calc(100dvh-150px)]"
                    data-ritual-phase={phase}
                >
                    {/* 頂部靜心引導 */}
                    <div className="text-center animate-ink-reveal">
                        <p className="font-latin text-[10px] md:text-xs tracking-[0.38em] text-[#c8a46b]/80 uppercase mb-2">
                            HEART SINCERITY · DIVINATION
                        </p>
                        <p className="text-sm md:text-base text-[#efece6]/85 tracking-[0.26em] font-light">
                            默念姓名與所求之事
                        </p>
                    </div>

                    {/* 中央留白舞台區（WebGL 失敗時顯示安全 2D 降級筊杯） */}
                    <div className="flex-1 w-full min-h-[250px] md:min-h-[330px] flex items-center justify-center pointer-events-none">
                        {fallbackMode && (
                            <div className="flex gap-10 items-center">
                                {blocks.map((b, i) => (
                                    <div
                                        key={i}
                                        className={`w-20 h-10 rounded-b-full border transition-all duration-500 ${
                                            isBusy ? 'animate-bounce' : ''
                                        } ${
                                            b === 1
                                                ? 'bg-[#e0cca9] border-[#963d33]'
                                                : 'bg-[#8f3228] border-[#c8a46b]/40'
                                        }`}
                                    />
                                ))}
                            </div>
                        )}
                    </div>

                    {/* 底部結果顯影與操作按鈕 */}
                    <div className="w-full flex flex-col items-center">
                        <div className="min-h-[132px] flex items-center justify-center w-full mb-5">
                            {phase === "RESULT" && (
                                <div className="obsidian-glass rounded-xl px-8 py-5 text-center max-w-md w-full animate-ink-reveal">
                                    <div className="flex items-center justify-center gap-4 text-[11px] tracking-[0.2em] text-[#8e8a82] mb-2">
                                        <span>{faceLabel(blocks[0])}</span>
                                        <span className="text-[#c8a46b]/50">✦</span>
                                        <span>{faceLabel(blocks[1])}</span>
                                    </div>
                                    <h2 className={`text-3xl md:text-4xl font-light tracking-[0.35em] pl-[0.35em] mb-2 ${resultToneClass}`}>
                                        {resultText}
                                    </h2>
                                    <div className="gold-hairline w-20 mx-auto my-3"></div>
                                    <p className="text-[#efece6]/80 text-sm tracking-[0.18em] font-light">
                                        {resultDesc}
                                    </p>
                                </div>
                            )}

                            {isBusy && (
                                <div className="flex flex-col items-center gap-2">
                                    <p className="text-xs tracking-[0.38em] text-[#c8a46b]/85 animate-pulse pl-[0.38em]">
                                        {BLOCK_PHASE_LABELS[phase] || '請 示 中'}
                                    </p>
                                    <div className="flex items-center gap-1.5">
                                        {['PREPARING', 'THROWING', 'COLLISION', 'SETTLING', 'REVEAL'].map((step) => (
                                            <span
                                                key={step}
                                                className={`h-1 rounded-full transition-all duration-300 ${
                                                    phase === step
                                                        ? 'w-5 bg-[#e6cca0]'
                                                        : 'w-1.5 bg-[#c8a46b]/25'
                                                }`}
                                            />
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="flex items-center gap-3">
                            <button
                                onClick={toss}
                                disabled={isBusy}
                                className="ritual-btn ritual-btn-primary rounded-full py-3.5 text-sm font-normal outline-none"
                            >
                                {isBusy ? '請 示 中' : phase === 'RESULT' ? '再 次 擲 筊' : '誠 心 擲 筊'}
                            </button>
                            {phase === 'RESULT' && (
                                <button
                                    onClick={resetBlocks}
                                    className="ritual-btn rounded-full py-3.5 !px-6 text-xs font-normal outline-none"
                                >
                                    重置
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // =====================================================================
        // 2. 三元牌元件 (TriadCards) — 嚴格保留雙階段排序與 12 組解讀
        //    7 狀態 FSM：IDLE → SHUFFLING → SELECTING → LIFTING → FLIPPING → REVEAL → RESULT
        // =====================================================================
        const CARD_PHASE_LABELS = {
            IDLE: '',
            SHUFFLING: '洗 牌 佈 陣 中',
            SELECTING: '',
            LIFTING: '收 束 聚 氣 中',
            FLIPPING: '三 元 翻 轉 揭 示',
            REVEAL: '神 諭 顯 影 中',
            RESULT: ''
        };

        const CardBackOrnament = () => (
            <div className="card-back-ornament">
                <svg viewBox="0 0 120 180" className="w-4/5 h-4/5 opacity-70" fill="none" stroke="#c8a46b" strokeWidth="0.75">
                    <rect x="6" y="6" width="108" height="168" rx="4" strokeOpacity="0.45" />
                    <circle cx="60" cy="90" r="38" strokeOpacity="0.75" />
                    <circle cx="60" cy="90" r="26" strokeDasharray="2 3" strokeOpacity="0.55" />
                    <polygon points="60,48 96,111 24,111" strokeOpacity="0.7" />
                    <polygon points="60,132 96,69 24,69" strokeOpacity="0.45" />
                    <circle cx="60" cy="90" r="4" fill="#e6cca0" />
                    <line x1="60" y1="14" x2="60" y2="40" strokeOpacity="0.45" />
                    <line x1="60" y1="140" x2="60" y2="166" strokeOpacity="0.45" />
                </svg>
            </div>
        );

        // 獨立宣告於 TriadCards 外部，確保狀態更新時 DOM 不會重新掛載，完整保留 GSAP 3D 洗牌與選取過渡動畫
        const InteractiveCard = ({ card, idx, orderList, isSelectingAllowed, onClick }) => {
            const index = orderList.indexOf(card.id);
            const selectIdx = index !== -1 ? index + 1 : null;
            const isReceded = orderList.length === 3 && !selectIdx;
            const cardRef = useRef(null);
            const [tilt, setTilt] = useState({ rx: 0, ry: 0 });

            const baseAngle = idx === 0 ? 8 : idx === 2 ? -8 : 0;
            const baseZ = idx === 1 ? 18 : -8;
            const floatDelay = `${idx * 0.9}s`;

            const onMouseMove = (e) => {
                if (!cardRef.current || !isSelectingAllowed) return;
                const rect = cardRef.current.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                setTilt({ rx: -y * 16, ry: x * 18 });
            };

            const onMouseLeave = () => {
                setTilt({ rx: 0, ry: 0 });
            };

            return (
                <div
                    className="deck-card-slot snap-center shrink-0 w-[66vw] max-w-[230px] sm:w-[210px] md:w-[230px] px-2 py-4 tarot-stage-perspective"
                >
                    <div
                        ref={cardRef}
                        onClick={() => onClick(card.id)}
                        onMouseMove={onMouseMove}
                        onMouseLeave={onMouseLeave}
                        className={`card-3d-wrapper animate-zen-float ${isSelectingAllowed ? 'cursor-pointer' : 'pointer-events-none'} ${isReceded ? 'card-unselected-recede' : ''}`}
                        style={{
                            animationDelay: floatDelay,
                            transform: `translateZ(${selectIdx ? 36 : baseZ}px) rotateX(${tilt.rx}deg) rotateY(${baseAngle + tilt.ry}deg) translateY(${selectIdx ? -14 : 0}px)`
                        }}
                    >
                        <div className={`deck-card-inner card-3d-inner ${selectIdx ? 'card-selected-glow' : ''}`}>
                            <div className="card-3d-thickness"></div>
                            <div className="card-face card-face-front">
                                <img
                                    src={card.img}
                                    alt={card.title}
                                    className="w-full h-full object-cover scale-[1.05] pointer-events-none select-none transition-transform duration-700"
                                />
                                <div className="absolute inset-0 bg-gradient-to-t from-black/55 via-transparent to-black/15 pointer-events-none" />
                                <div className="deck-sheen card-sheen" />

                                {selectIdx && (
                                    <div className="selection-seal" title={`第 ${selectIdx} 順位`}>
                                        {ROMAN[selectIdx - 1]}
                                    </div>
                                )}
                            </div>
                            <div className="card-face card-face-back">
                                <CardBackOrnament />
                            </div>
                        </div>
                    </div>
                    <p className="deck-card-caption font-latin text-[10px] tracking-[0.22em] text-[#e6cca0]/75 uppercase text-center mt-3.5 pointer-events-none">
                        {card.title}
                    </p>
                </div>
            );
        };

        const TriadCards = () => {
            const [stage, setStage] = useState('main-select'); // main-select, main-reveal, sub-select, final-reveal, final-overview
            const [cardPhase, setCardPhase] = useState('IDLE'); // IDLE | SHUFFLING | SELECTING | LIFTING | FLIPPING | REVEAL | RESULT
            const [mainOrder, setMainOrder] = useState([]);
            const [subOrder, setSubOrder] = useState([]);
            const selectDeckRef = useRef(null);
            const revealGridRef = useRef(null);
            const revealTextRef = useRef(null);
            const tlRef = useRef(null);
            const sessionRef = useRef(0);

            // 既有資料定義（嚴格保留）
            const mainCardsData = [
                { id: 'origin', title: 'Origo Animae', deTitle: 'Ursprung der Seele', img: 'https://img.yra.tw/x/Origo%20Animae-2.png' },
                { id: 'bond', title: 'Transmutatio Vinculi', deTitle: 'Wandel der Verbindung', img: 'https://img.yra.tw/x/Transmutatio%20Vinculi-2.png' },
                { id: 'future', title: 'Realis Futura', deTitle: 'Verwirklichung der Zukunft', img: 'https://img.yra.tw/x/Reakis%20Futura-2.png' }
            ];

            const subCardsData = [
                { id: 'arbor', title: 'Arbor', img: 'https://img.yra.tw/x/Arbor-1.png' },
                { id: 'astra', title: 'ASTRA', img: 'https://img.yra.tw/x/ASTRA-2.png' },
                { id: 'semen', title: 'Semen', img: 'https://img.yra.tw/x/Semen02.png' }
            ];

            // 既有 12 組解讀字典（嚴格保留）
            const interpretations = {
                main: {
                    "origin-bond-future": {
                        title: "Radix Circulus", zhTitle: "根源環圈",
                        poem: "根莖深埋影中，喚醒交織的脈流，\n焰光碎星河，預言的環圈永轉。\n起源之息，化作未來的漩渦。",
                        note: "根源轉變至實現相當流暢，若對未來感到不確定——請借過去力量前行。"
                    },
                    "origin-future-bond": {
                        title: "Semen Stellarum", zhTitle: "星辰種子",
                        poem: "起源的種焰，躍入星辰的裂隙，\n轉變遲來，卻織成無形的橋梁。\n未來先至，牽引根源的低語。",
                        note: "起源直達未來，轉變雖緩——請用未來視野連結現在。"
                    },
                    "bond-origin-future": {
                        title: "Vinculum Radicis", zhTitle: "根源連結",
                        poem: "連結的波瀾，溯回隱藏的根源，\n實現如影隨形，點亮遺忘的火種。\n轉變為首，循環中尋得永恆。",
                        note: "轉變引導著根源，實現隱於其中——請從連結中尋找永續平衡。"
                    },
                    "bond-future-origin": {
                        title: "Fluctus Originis", zhTitle: "起源波瀾",
                        poem: "互織的線索，引領焰河奔向盡頭，\n起源回響，成為未來的幽光。\n轉變開啟，根莖在星中重生。",
                        note: "轉變推動實現，起源產生回響——請用未來光輝重塑根基。"
                    },
                    "future-origin-bond": {
                        title: "Astra Radix", zhTitle: "根源星辰",
                        poem: "預言的星芒，先落起源的土壤，\n連結緩緩綻放，如霧中隱現的藤。\n未來引路，根源與轉變交融。",
                        note: "未來喚醒起源，連結正緩緩發生——讓預言融合內外。"
                    },
                    "future-bond-origin": {
                        title: "Vortex Seminis", zhTitle: "種子漩渦",
                        poem: "實現的漩渦，吞噬連結的餘輝，\n起源悄然甦醒，在影中編織新環。\n未來倒轉，根莖成為永夜的燈。",
                        note: "未來轉化連結，起源正在甦醒——用漩渦力量照亮黑暗。"
                    }
                },
                sub: {
                    "semen-arbor-astra": {
                        title: "Umbra Arboris", zhTitle: "樹影幽暗",
                        poem: "種子的幽暗，蔓生樹影的糾纏，\n星辰遙遠，卻在根中隱藏呼喚。\n起源不滿，指引向光的無形枝。",
                        note: "起源蔓延至未來，請從根源尋找光亮，療癒內在的糾纏。"
                    },
                    "semen-astra-arbor": {
                        title: "Fragmentum Stellarum", zhTitle: "星辰碎粒",
                        poem: "起源的碎粒，散落星河的邊緣，\n樹木遲緩生長，承載預言的重量。\n種焰黯淡，指引在夜中尋枝。",
                        note: "起源散落於未來，需用樹木支撐——耐心承載未知。"
                    },
                    "arbor-semen-astra": {
                        title: "Curvus Seminis", zhTitle: "種子彎曲",
                        poem: "樹枝的彎曲，壓抑種子的脈動，\n星光滲入，喚醒遺失的軌跡。\n現在不滿，指引起源通往天穹。",
                        note: "現在壓抑了起源，讓星光滲入——從根源通向廣闊。"
                    },
                    "arbor-astra-semen": {
                        title: "Velum Astrae", zhTitle: "星辰面紗",
                        poem: "樹影遮蔽星途，預言如風掠過，\n種子回歸土中，孕育新的輪迴。\n現在黯然，指引未來回溯根源。",
                        note: "現在遮蔽了未來，回歸種子——用輪迴重塑平衡。"
                    },
                    "astra-semen-arbor": {
                        title: "Cadens Seminis", zhTitle: "種子墜落",
                        poem: "星辰的墜落，攪動種子的沉睡，\n樹枝伸展，捕捉遺落的輝芒。\n未來不滿，指引起源化作綠焰。",
                        note: "未來攪動了起源，樹枝捕捉——轉化墜落為新生力量。"
                    },
                    "astra-arbor-semen": {
                        title: "Wurzelstern", zhTitle: "根源之星",
                        poem: "預言之星，纏繞樹木的枝蔓，\n種子深藏，等待循環的召喚。\n未來朦朧，指引現在回歸塵土。",
                        note: "未來纏繞著現在，回歸種子——在等待中尋找召喚。"
                    }
                }
            };

            const isReduced = () =>
                window.DivinationStage && typeof window.DivinationStage.getReducedMotion === 'function'
                    ? window.DivinationStage.getReducedMotion()
                    : false;

            // 背景預載全部 6 張外部牌圖
            useEffect(() => {
                [...mainCardsData, ...subCardsData].forEach((c) => {
                    const img = new Image();
                    img.src = c.img;
                });
                return () => {
                    sessionRef.current++;
                    if (tlRef.current) tlRef.current.kill();
                };
            }, []);

            // 同步三元牌目前狀態與選牌進度至 3D 玄金三元星陣舞台
            useEffect(() => {
                if (window.DivinationStage && typeof window.DivinationStage.syncTriadCardState === 'function') {
                    window.DivinationStage.syncTriadCardState(cardPhase, stage);
                }
            }, [cardPhase, stage]);

            useEffect(() => {
                const count =
                    stage === 'main-select'
                        ? mainOrder.length
                        : stage === 'sub-select'
                        ? subOrder.length
                        : 3;
                if (window.DivinationStage && typeof window.DivinationStage.notifyCardSelection === 'function') {
                    window.DivinationStage.notifyCardSelection(count);
                }
            }, [stage, mainOrder.length, subOrder.length]);

            // 進入 main-select / sub-select：執行 IDLE → SHUFFLING（3D 牌背疊合、交錯洗牌、扇形翻開）→ SELECTING
            useEffect(() => {
                if (stage !== 'main-select' && stage !== 'sub-select') return;
                const mySession = ++sessionRef.current;
                if (tlRef.current) tlRef.current.kill();

                setCardPhase('SHUFFLING');

                const reduced = isReduced();
                if (window.gsap && selectDeckRef.current) {
                    const slots = selectDeckRef.current.querySelectorAll('.deck-card-slot');
                    const inners = selectDeckRef.current.querySelectorAll('.deck-card-inner');
                    const sheens = selectDeckRef.current.querySelectorAll('.deck-sheen');
                    const captions = selectDeckRef.current.querySelectorAll('.deck-card-caption');
                    const isMobile = window.innerWidth < 768;
                    const stackSpan = isMobile ? 44 : 215;

                    const tl = window.gsap.timeline({
                        onComplete: () => {
                            if (sessionRef.current === mySession) {
                                window.gsap.set([slots, inners], { clearProps: 'transform' });
                                setCardPhase('SELECTING');
                            }
                        }
                    });
                    tlRef.current = tl;

                    if (reduced) {
                        tl.fromTo(
                            slots,
                            { opacity: 0, y: 18 },
                            { opacity: 1, y: 0, duration: 0.28, stagger: 0.05, ease: 'power2.out' }
                        );
                    } else {
                        // 初始：三張牌以東方星盤牌背朝上 (rotateY: 180) 聚攏於中央疊合
                        window.gsap.set(captions, { opacity: 0, y: 8 });
                        window.gsap.set(inners, {
                            rotateY: 180,
                            rotateZ: (i) => (i - 1) * 4
                        });

                        tl.fromTo(
                            slots,
                            {
                                opacity: 0,
                                y: 42,
                                scale: 0.86,
                                x: (i) => (1 - i) * stackSpan
                            },
                            {
                                opacity: 1,
                                y: -8,
                                scale: 0.95,
                                x: (i) => (1 - i) * stackSpan * 0.92,
                                duration: 0.34,
                                ease: 'power3.out',
                                onStart: () => {
                                    if (window.DivinationStage) {
                                        window.DivinationStage.playCardRevealSound();
                                    }
                                }
                            }
                        );

                        // 交錯切牌動量 (Momentum)：左右牌交錯穿梭後舒展歸位
                        tl.to(slots, {
                            x: (i) => (i === 0 ? stackSpan * 0.42 : i === 2 ? -stackSpan * 0.42 : 0),
                            y: (i) => (i === 1 ? -20 : 4),
                            scale: 0.98,
                            duration: 0.28,
                            ease: 'sine.inOut'
                        });

                        tl.to(slots, {
                            x: 0,
                            y: 0,
                            scale: 1,
                            duration: 0.44,
                            stagger: 0.06,
                            ease: 'expo.out',
                            onStart: () => {
                                if (window.DivinationStage) {
                                    window.DivinationStage.playCardRevealSound();
                                }
                            }
                        });

                        // 三元牌陣依序 3D 翻開牌面，伴隨燙金掃光
                        tl.to(
                            inners,
                            {
                                rotateY: 0,
                                rotateZ: 0,
                                duration: 0.68,
                                stagger: 0.09,
                                ease: 'expo.inOut'
                            },
                            '-=0.22'
                        );

                        tl.fromTo(
                            sheens,
                            { xPercent: -130, opacity: 0 },
                            {
                                xPercent: 130,
                                opacity: 0.8,
                                duration: 0.58,
                                stagger: 0.09,
                                ease: 'power2.inOut'
                            },
                            '-=0.58'
                        );

                        tl.to(
                            captions,
                            { opacity: 1, y: 0, duration: 0.38, stagger: 0.07, ease: 'power2.out' },
                            '-=0.25'
                        );
                    }
                } else {
                    const timer = setTimeout(() => {
                        if (sessionRef.current === mySession) setCardPhase('SELECTING');
                    }, 300);
                    return () => clearTimeout(timer);
                }

                return () => {
                    if (tlRef.current) tlRef.current.kill();
                };
            }, [stage]);

            // 進入 main-reveal / final-reveal：執行 LIFTING → FLIPPING → REVEAL → RESULT（翻牌前絕不提前劇透）
            useEffect(() => {
                if (stage !== 'main-reveal' && stage !== 'final-reveal') return;
                const mySession = ++sessionRef.current;
                if (tlRef.current) tlRef.current.kill();

                setCardPhase('LIFTING');
                const reduced = isReduced();

                if (window.gsap && revealGridRef.current) {
                    const cardInners = revealGridRef.current.querySelectorAll('.reveal-card-inner');
                    const sheens = revealGridRef.current.querySelectorAll('.reveal-sheen');
                    const titles = revealGridRef.current.querySelectorAll('.reveal-card-title');

                    const tl = window.gsap.timeline();
                    tlRef.current = tl;

                    // 1. LIFTING (Anticipation)：三張牌以東方星盤牌背向上懸浮聚氣、後傾蓄勢（嚴格零劇透）
                    tl.fromTo(
                        cardInners,
                        { rotateY: 180, rotateX: -12, y: 56, z: -50, opacity: 0, scale: 0.82 },
                        {
                            rotateY: 196,
                            rotateX: 8,
                            y: -16,
                            z: 24,
                            opacity: 1,
                            scale: 1.03,
                            duration: reduced ? 0.24 : 0.72,
                            stagger: reduced ? 0.05 : 0.12,
                            ease: 'power4.out'
                        }
                    );

                    // 屏息靜默 (Silence) 凝聚儀式張力
                    tl.to({}, { duration: reduced ? 0.04 : 0.18 });

                    // 2. FLIPPING (Momentum & Impact)：三張牌逐一躍出景深、翻越 90° 觸發 3D 星波共鳴後沉穩落定
                    tl.call(() => {
                        if (sessionRef.current === mySession) {
                            setCardPhase('FLIPPING');
                        }
                    });

                    const flipBaseTime = tl.duration();
                    cardInners.forEach((inner, i) => {
                        const startAt = flipBaseTime + i * (reduced ? 0.1 : 0.34);

                        if (reduced) {
                            tl.to(
                                inner,
                                { rotateY: 0, rotateX: 0, y: 0, z: 0, scale: 1, duration: 0.32, ease: 'power2.out' },
                                startAt
                            );
                        } else {
                            // 前半程：向鏡頭躍升蓄勢翻至 90° 臨界點
                            tl.to(
                                inner,
                                {
                                    rotateY: 90,
                                    rotateX: 3,
                                    y: -26,
                                    z: 68,
                                    scale: 1.09,
                                    duration: 0.34,
                                    ease: 'power2.in',
                                    onComplete: () => {
                                        if (sessionRef.current === mySession && window.DivinationStage) {
                                            window.DivinationStage.triggerCardFlipImpulse(i);
                                            window.DivinationStage.playCardRevealSound();
                                        }
                                    }
                                },
                                startAt
                            );

                            // 後半程：具實體重量感地展開牌面並回落定格
                            tl.to(
                                inner,
                                {
                                    rotateY: 0,
                                    rotateX: 0,
                                    y: 0,
                                    z: 0,
                                    scale: 1,
                                    duration: 0.56,
                                    ease: 'power4.out'
                                },
                                startAt + 0.34
                            );

                            if (sheens[i]) {
                                tl.fromTo(
                                    sheens[i],
                                    { xPercent: -130, opacity: 0 },
                                    { xPercent: 130, opacity: 0.88, duration: 0.62, ease: 'power2.inOut' },
                                    startAt + 0.28
                                );
                            }

                            if (titles[i]) {
                                tl.fromTo(
                                    titles[i],
                                    { opacity: 0, y: 8 },
                                    { opacity: 1, y: 0, duration: 0.42, ease: 'power3.out' },
                                    startAt + 0.52
                                );
                            }
                        }
                    });

                    // 3. Silence (0.26s 靜默留白) → REVEAL：面板如古卷舒展，詩句逐行水墨顯影
                    tl.to({}, { duration: reduced ? 0.05 : 0.26 });

                    tl.call(() => {
                        if (sessionRef.current === mySession) {
                            setCardPhase('REVEAL');
                            if (window.DivinationStage) {
                                window.DivinationStage.playChime('sacred');
                            }
                        }
                    });

                    if (revealTextRef.current) {
                        const staggerItems = revealTextRef.current.querySelectorAll('.oracle-stagger-item');
                        tl.fromTo(
                            revealTextRef.current,
                            { opacity: 0.12, y: 16, clipPath: 'inset(0% 0% 100% 0%)' },
                            {
                                opacity: 1,
                                y: 0,
                                clipPath: 'inset(0% 0% 0% 0%)',
                                duration: reduced ? 0.28 : 0.78,
                                ease: 'power4.out'
                            }
                        );

                        if (staggerItems.length > 0 && !reduced) {
                            tl.fromTo(
                                staggerItems,
                                { opacity: 0, y: 10, filter: 'blur(4px)' },
                                {
                                    opacity: 1,
                                    y: 0,
                                    filter: 'blur(0px)',
                                    duration: 0.54,
                                    stagger: 0.11,
                                    ease: 'power3.out'
                                },
                                '-=0.46'
                            );
                        }
                    }

                    // 4. RESULT：完全解鎖後續操作
                    tl.call(() => {
                        if (sessionRef.current === mySession) {
                            setCardPhase('RESULT');
                        }
                    });
                } else {
                    setCardPhase('RESULT');
                }

                return () => {
                    if (tlRef.current) tlRef.current.kill();
                };
            }, [stage]);

            const isSelectingAllowed = cardPhase === 'SELECTING';
            const isRevealLocked = cardPhase === 'LIFTING' || cardPhase === 'FLIPPING';
            const showOracleText = cardPhase === 'REVEAL' || cardPhase === 'RESULT';

            const handleMainClick = (id) => {
                if (stage !== 'main-select' || !isSelectingAllowed) return;
                if (mainOrder.includes(id)) setMainOrder(mainOrder.filter(item => item !== id));
                else if (mainOrder.length < 3) {
                    setMainOrder([...mainOrder, id]);
                    if (window.DivinationStage) window.DivinationStage.playCardRevealSound();
                }
            };

            const handleSubClick = (id) => {
                if (stage !== 'sub-select' || !isSelectingAllowed) return;
                if (subOrder.includes(id)) setSubOrder(subOrder.filter(item => item !== id));
                else if (subOrder.length < 3) {
                    setSubOrder([...subOrder, id]);
                    if (window.DivinationStage) window.DivinationStage.playCardRevealSound();
                }
            };

            const getCard = (id, list) => list.find(c => c.id === id);

            const getResultData = (type) => {
                if (type === 'main' && mainOrder.length === 3) {
                    return interpretations.main[mainOrder.join('-')];
                }
                if (type === 'sub' && subOrder.length === 3) {
                    return interpretations.sub[subOrder.join('-')];
                }
                return null;
            };

            const activeOrder = stage === 'main-select' ? mainOrder : subOrder;
            const activeCards = stage === 'main-select' ? mainCardsData : subCardsData;

            return (
                <div
                    className="flex-1 flex flex-col items-center w-full max-w-5xl mx-auto px-4 pt-5 pb-12"
                    data-ritual-phase={cardPhase}
                >
                    {/* 階段標題 */}
                    <div className="text-center mb-3 md:mb-5 animate-ink-reveal">
                        <p className="font-latin text-[10px] md:text-xs tracking-[0.36em] text-[#c8a46b]/80 uppercase mb-2">
                            {stage.includes('main')
                                ? 'PHASE I · ORIGIN'
                                : stage.includes('sub')
                                ? 'PHASE II · SUBCONSCIOUS'
                                : 'PHASE III · INTEGRATION'}
                        </p>
                        <h2 className="text-base md:text-xl font-light text-[#efece6] tracking-[0.18em] max-w-2xl mx-auto leading-relaxed">
                            {stage === 'main-select' && "主牌組：依照你現在生活中的感受，選擇最優先的順序"}
                            {stage === 'main-reveal' && "三元顯現：連結、起源與未來"}
                            {stage === 'sub-select' && "子牌組：依照你現在生活中的感受，選擇最不優先的順序"}
                            {stage === 'final-reveal' && "命運之流：潛意識的低語"}
                            {stage === 'final-overview' && "全覽對照：顯意識與潛意識的交織"}
                        </h2>
                    </div>

                    {/* 選牌階段 (IDLE → SHUFFLING → SELECTING) */}
                    {(stage === 'main-select' || stage === 'sub-select') && (
                        <div className="flex-1 flex flex-col items-center justify-center w-full">
                            <div
                                ref={selectDeckRef}
                                className="w-full flex md:justify-center overflow-x-auto snap-x snap-mandatory gap-4 md:gap-6 px-[17vw] md:px-4 py-4 no-scrollbar items-center"
                            >
                                {activeCards.map((card, idx) => (
                                    <InteractiveCard
                                        key={card.id}
                                        card={card}
                                        idx={idx}
                                        orderList={activeOrder}
                                        isSelectingAllowed={isSelectingAllowed}
                                        onClick={stage === 'main-select' ? handleMainClick : handleSubClick}
                                    />
                                ))}
                            </div>

                            {/* 三元序位狀態指示槽 */}
                            <div className="flex items-center gap-3 mt-1 mb-5">
                                {[0, 1, 2].map((slot) => {
                                    const filled = Boolean(activeOrder[slot]);
                                    return (
                                        <div
                                            key={slot}
                                            className={`flex items-center gap-2 px-3 py-1 rounded-full border text-[11px] font-latin tracking-[0.2em] transition-all duration-500 ${
                                                filled
                                                    ? 'border-[#c8a46b]/70 bg-[#c8a46b]/15 text-[#e6cca0]'
                                                    : 'border-white/10 text-[#8e8a82]/60'
                                            }`}
                                        >
                                            <span>{ROMAN[slot]}</span>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="h-14 flex items-center justify-center">
                                {cardPhase === 'SHUFFLING' ? (
                                    <p className="text-xs tracking-[0.36em] text-[#c8a46b]/80 animate-pulse pl-[0.36em]">
                                        {CARD_PHASE_LABELS.SHUFFLING}
                                    </p>
                                ) : activeOrder.length === 3 ? (
                                    <button
                                        onClick={() => setStage(stage === 'main-select' ? 'main-reveal' : 'final-reveal')}
                                        disabled={!isSelectingAllowed}
                                        className="ritual-btn ritual-btn-primary rounded-full py-3.5 text-sm animate-ink-reveal"
                                    >
                                        {stage === 'main-select' ? '確認顯現' : '揭示全貌'}
                                    </button>
                                ) : (
                                    <p className="text-xs tracking-[0.28em] text-[#8e8a82]">
                                        請依直覺點選 {3 - activeOrder.length} 張牌卡
                                    </p>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 翻牌揭示階段 (LIFTING → FLIPPING → REVEAL → RESULT) */}
                    {(stage === 'main-reveal' || stage === 'final-reveal') && (
                        <div className="flex-1 flex flex-col items-center w-full">
                            {/* 3D 翻轉牌陣 */}
                            <div
                                ref={revealGridRef}
                                className="grid grid-cols-3 gap-3 sm:gap-5 md:gap-7 w-full max-w-2xl mb-5 tarot-stage-perspective"
                            >
                                {(stage === 'main-reveal' ? mainOrder : subOrder).map((id, index) => {
                                    const list = stage === 'main-reveal' ? mainCardsData : subCardsData;
                                    const card = getCard(id, list);
                                    return (
                                        <div key={id} className="flex flex-col items-center tarot-stage-perspective">
                                            <div className="reveal-card-inner card-3d-inner w-full max-w-[162px]">
                                                <div className="card-3d-thickness"></div>
                                                <div className="card-face card-face-front">
                                                    <img
                                                        src={card.img}
                                                        alt={card.title}
                                                        className="w-full h-full object-cover scale-[1.05]"
                                                    />
                                                    <div className="reveal-sheen card-sheen" />
                                                    <div className="selection-seal !w-7 !h-7 !text-xs !top-2.5 !right-2.5">
                                                        {ROMAN[index]}
                                                    </div>
                                                </div>
                                                <div className="card-face card-face-back">
                                                    <CardBackOrnament />
                                                </div>
                                            </div>
                                            <p className="reveal-card-title font-latin text-[10px] md:text-xs tracking-[0.2em] text-[#8e8a82] mt-2.5 uppercase opacity-0">
                                                {card.title}
                                            </p>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* 翻牌前顯示儀式提示，翻牌完成進入 REVEAL 後才顯影解讀（嚴格防劇透） */}
                            {isRevealLocked && (
                                <div className="min-h-[160px] flex items-center justify-center">
                                    <p className="text-xs tracking-[0.38em] text-[#c8a46b]/85 animate-pulse pl-[0.38em]">
                                        {CARD_PHASE_LABELS[cardPhase]}
                                    </p>
                                </div>
                            )}

                            {getResultData(stage === 'main-reveal' ? 'main' : 'sub') && (
                                <div
                                    ref={revealTextRef}
                                    className={`obsidian-glass max-w-2xl w-full text-center px-6 py-5 md:px-8 md:py-6 rounded-xl mb-5 ${
                                        showOracleText ? '' : 'hidden'
                                    }`}
                                >
                                    <h3 className="oracle-stagger-item text-xl md:text-2xl font-latin font-semibold text-[#e6cca0] tracking-[0.22em] mb-1">
                                        {getResultData(stage === 'main-reveal' ? 'main' : 'sub').title}
                                    </h3>
                                    <p className="oracle-stagger-item text-xs md:text-sm text-[#8e8a82] tracking-[0.35em]">
                                        {getResultData(stage === 'main-reveal' ? 'main' : 'sub').zhTitle}
                                    </p>
                                    <div className="oracle-stagger-item gold-hairline w-24 mx-auto my-3.5"></div>
                                    <div className="text-[#efece6]/90 text-sm md:text-base leading-loose mb-4 font-light space-y-1">
                                        {getResultData(stage === 'main-reveal' ? 'main' : 'sub')
                                            .poem.split('\n')
                                            .map((line, lIdx) => (
                                                <p key={lIdx} className="oracle-stagger-item">
                                                    {line}
                                                </p>
                                            ))}
                                    </div>
                                    <div className="oracle-stagger-item bg-[#963d33]/15 border border-[#c8a46b]/25 rounded-lg px-4 py-2.5 inline-block">
                                        <p className="text-xs md:text-sm text-[#e6cca0] tracking-[0.14em] leading-relaxed">
                                            <span className="mr-2 text-[#c8a46b]">✦</span>
                                            {getResultData(stage === 'main-reveal' ? 'main' : 'sub').note}
                                        </p>
                                    </div>
                                </div>
                            )}

                            <div className="min-h-[48px] flex items-center justify-center">
                                {cardPhase === 'RESULT' && (
                                    stage === 'main-reveal' ? (
                                        <button
                                            onClick={() => setStage('sub-select')}
                                            className="ritual-btn rounded-full py-3 text-xs uppercase animate-ink-reveal"
                                        >
                                            前往子牌組
                                        </button>
                                    ) : (
                                        <button
                                            onClick={() => setStage('final-overview')}
                                            className="ritual-btn ritual-btn-primary rounded-full py-3 text-xs uppercase animate-ink-reveal"
                                        >
                                            全覽對照
                                        </button>
                                    )
                                )}
                            </div>
                        </div>
                    )}

                    {/* 全覽對照 (final-overview) */}
                    {stage === 'final-overview' && (
                        <div className="flex-1 flex flex-col items-center w-full animate-ink-reveal">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl">
                                {/* 左欄：主牌組 */}
                                <div className="obsidian-glass rounded-xl p-6 md:p-7 flex flex-col justify-between">
                                    <div>
                                        <div className="flex items-center justify-center gap-2 mb-4">
                                            <span className="cinnabar-stamp">顯意識 · 優先順序</span>
                                        </div>
                                        {getResultData('main') && (
                                            <div className="text-center">
                                                <h4 className="font-latin text-xl text-[#e6cca0] tracking-[0.18em] mb-1">
                                                    {getResultData('main').title}
                                                </h4>
                                                <p className="text-xs text-[#8e8a82] tracking-[0.3em] mb-4">
                                                    {getResultData('main').zhTitle}
                                                </p>
                                                <div className="gold-hairline w-16 mx-auto mb-4"></div>
                                                <p className="text-[#efece6]/85 text-sm leading-loose whitespace-pre-line mb-5 font-light">
                                                    {getResultData('main').poem}
                                                </p>
                                                <p className="text-xs text-[#e6cca0]/90 tracking-wider bg-black/30 border border-[#c8a46b]/15 p-3.5 rounded-lg leading-relaxed">
                                                    {getResultData('main').note}
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                    <div className="flex justify-center gap-3 mt-6">
                                        {mainOrder.map((id, idx) => (
                                            <div key={id} className="w-12 h-18 rounded-md overflow-hidden border border-[#c8a46b]/35 relative shadow-lg">
                                                <img src={getCard(id, mainCardsData).img} alt="" className="w-full h-full object-cover" />
                                                <div className="absolute top-0 right-0 bg-[#963d33] text-[#efece6] font-latin text-[9px] w-4 h-4 flex items-center justify-center">
                                                    {ROMAN[idx]}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* 右欄：子牌組 */}
                                <div className="obsidian-glass rounded-xl p-6 md:p-7 flex flex-col justify-between">
                                    <div>
                                        <div className="flex items-center justify-center gap-2 mb-4">
                                            <span className="cinnabar-stamp !border-[#c8a46b]/45 !text-[#e6cca0] !bg-[#c8a46b]/10">
                                                潛意識 · 非優先順序
                                            </span>
                                        </div>
                                        {getResultData('sub') && (
                                            <div className="text-center">
                                                <h4 className="font-latin text-xl text-[#e6cca0] tracking-[0.18em] mb-1">
                                                    {getResultData('sub').title}
                                                </h4>
                                                <p className="text-xs text-[#8e8a82] tracking-[0.3em] mb-4">
                                                    {getResultData('sub').zhTitle}
                                                </p>
                                                <div className="gold-hairline w-16 mx-auto mb-4"></div>
                                                <p className="text-[#efece6]/85 text-sm leading-loose whitespace-pre-line mb-5 font-light">
                                                    {getResultData('sub').poem}
                                                </p>
                                                <p className="text-xs text-[#e6cca0]/90 tracking-wider bg-black/30 border border-[#c8a46b]/15 p-3.5 rounded-lg leading-relaxed">
                                                    {getResultData('sub').note}
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                    <div className="flex justify-center gap-3 mt-6">
                                        {subOrder.map((id, idx) => (
                                            <div key={id} className="w-12 h-18 rounded-md overflow-hidden border border-white/20 relative shadow-lg">
                                                <img src={getCard(id, subCardsData).img} alt="" className="w-full h-full object-cover" />
                                                <div className="absolute top-0 right-0 bg-[#2a2c36] text-[#efece6] font-latin text-[9px] w-4 h-4 flex items-center justify-center">
                                                    {ROMAN[idx]}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="mt-10">
                                <button
                                    onClick={() => {
                                        setStage('main-select');
                                        setMainOrder([]);
                                        setSubOrder([]);
                                    }}
                                    className="ritual-btn rounded-full py-2.5 text-xs"
                                >
                                    重置儀式
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // =====================================================================
        // 3. 宇宙指引元件 (RandomGuide) — 嚴格保留原有 15 則指引與 7 狀態 FSM
        //    IDLE → PRAYING → SHAKING → EXTRACTING → FLOATING → REVEALING → RESULT
        // =====================================================================
        const ORACLE_PHASE_LABELS = {
            IDLE: '靜心凝神，啟動玄銅星儀接收宇宙指引',
            PRAYING: '萬籟俱寂，星儀屏息傾聽⋯',
            SHAKING: '玄銅星環共振運轉中⋯',
            EXTRACTING: '三環對齊，星芒凝聚⋯',
            FLOATING: '星象已定，靜待啟示',
            REVEALING: '古卷舒展，宇宙低語漸明',
            RESULT: '指引已現，細品其中深意'
        };

        const RandomGuide = () => {
            const [phase, setPhase] = useState("IDLE");
            const [currentGuide, setCurrentGuide] = useState({ main: "", sub: "" });
            const [oracleNo, setOracleNo] = useState(1);
            const [fallbackMode, setFallbackMode] = useState(false);

            const scrollPaperRef = useRef(null);
            const stampRef = useRef(null);
            const mainTextRef = useRef(null);
            const subTextRef = useRef(null);
            const tlRef = useRef(null);
            const sessionRef = useRef(0);
            const fallbackTimerRef = useRef(null);

            const isBusy = phase !== "IDLE" && phase !== "RESULT";
            const showScroll = phase === "REVEALING" || phase === "RESULT";

            // 既有 15 則宇宙指引資料（嚴格保留，一字不改）
            const guides = [
                { main: "「行到水窮處，坐看雲起時」", sub: "— 王維。適合靜觀其變，答案就在轉彎處。" },
                { main: "「萬物皆有裂痕，那是光照進來的地方」", sub: "— 萊昂納德·科恩。擁抱不完美，那是突破點。" },
                { main: "「月が綺麗ですね」", sub: "（月色真美）— 夏目漱石。珍惜眼前的含蓄與美好，不必急著說破。" },
                { main: "「Stay hungry, stay foolish.」", sub: "（求知若渴，虛懷若谷）— 保持初衷，大膽去闖。" },
                { main: "「回首向來蕭瑟處，也無風雨也無晴」", sub: "— 蘇軾。看淡得失，平靜是最大的力量。" },
                { main: "「The woods are lovely, dark and deep.」", sub: "（森林可愛、幽暗而深邃）— 前方迷人但充滿挑戰，記得你的承諾。" },
                { main: "「既然選擇了遠方，便只顧風雨兼程」", sub: "— 汪國真。目標已定，就不要再回頭猶豫。" },
                { main: "「凡是過往，皆為序章」", sub: "— 莎士比亞。放下過去的包袱，新的篇章正在開始。" },
                { main: "「知其不可而為之」", sub: "— 典出《論語》。有時明知艱難仍要去試，便是你的道。" },
                { main: "「潘朵拉的盒子已打開，但希望仍留其中」", sub: "— 希臘神話。混難中必存生機。" },
                { main: "「衝了，不要猶豫」", sub: "當下的直覺就是最準確的導航。" },
                { main: "「現在不是時候」", sub: "退後一步，讓子彈飛一會兒。" },
                { main: "「問問身邊長輩或智者的意見」", sub: "經驗的火炬能幫你照亮盲點。" },
                { main: "「先去睡一覺，醒來再決定」", sub: "潛意識會在夢中為你整理混亂。" },
                { main: "「放棄也是一種勇氣的表現」", sub: "止損是為了把能量留給更好的事。" }
            ];

            useEffect(() => {
                if (window.DivinationStage && !window.DivinationStage.isWebGLAvailable()) {
                    setFallbackMode(true);
                }
                return () => {
                    sessionRef.current++;
                    if (fallbackTimerRef.current) clearTimeout(fallbackTimerRef.current);
                    if (tlRef.current) tlRef.current.kill();
                    if (window.DivinationStage && typeof window.DivinationStage.resetCosmicOracle === 'function') {
                        window.DivinationStage.resetCosmicOracle();
                    }
                };
            }, []);

            // REVEALING 階段：卷軸舒展 → 依序顯影「星象序號 → 宇宙指引 → 釋義」→ RESULT
            useEffect(() => {
                if (phase !== "REVEALING") return;
                const mySession = sessionRef.current;
                if (tlRef.current) tlRef.current.kill();

                const reduced =
                    window.DivinationStage && typeof window.DivinationStage.getReducedMotion === 'function'
                        ? window.DivinationStage.getReducedMotion()
                        : false;

                if (window.gsap && scrollPaperRef.current) {
                    const tl = window.gsap.timeline({
                        onComplete: () => {
                            if (sessionRef.current === mySession) {
                                setPhase("RESULT");
                            }
                        }
                    });
                    tlRef.current = tl;

                    tl.fromTo(
                        scrollPaperRef.current,
                        { width: 0, opacity: 0.25 },
                        {
                            width: '100%',
                            opacity: 1,
                            duration: reduced ? 0.3 : 0.92,
                            ease: 'expo.inOut',
                            onStart: () => {
                                if (window.DivinationStage) {
                                    window.DivinationStage.playCardRevealSound();
                                }
                            }
                        }
                    );

                    if (stampRef.current) {
                        tl.fromTo(
                            stampRef.current,
                            { opacity: 0, scale: 0.85, y: 8 },
                            { opacity: 1, scale: 1, y: 0, duration: reduced ? 0.18 : 0.45, ease: 'power3.out' },
                            '-=0.18'
                        );
                    }
                    if (mainTextRef.current) {
                        tl.fromTo(
                            mainTextRef.current,
                            { opacity: 0, y: 14, filter: 'blur(4px)' },
                            { opacity: 1, y: 0, filter: 'blur(0px)', duration: reduced ? 0.2 : 0.62, ease: 'power4.out' },
                            '-=0.05'
                        );
                    }
                    if (subTextRef.current) {
                        tl.fromTo(
                            subTextRef.current,
                            { opacity: 0, y: 10, filter: 'blur(3px)' },
                            { opacity: 1, y: 0, filter: 'blur(0px)', duration: reduced ? 0.2 : 0.58, ease: 'power3.out' },
                            '-=0.08'
                        );
                    }
                } else {
                    setPhase("RESULT");
                }

                return () => {
                    if (tlRef.current) tlRef.current.kill();
                };
            }, [phase]);

            const getGuide = () => {
                if (isBusy) return;

                const mySession = ++sessionRef.current;
                setPhase("PRAYING");

                // 既有均勻隨機抽取邏輯（嚴格保留）
                const idx = Math.floor(Math.random() * guides.length);
                const chosen = guides[idx];
                const num = idx + 1;

                const onRevealed = () => {
                    if (sessionRef.current !== mySession) return;
                    setOracleNo(num);
                    setCurrentGuide(chosen);
                    setPhase("REVEALING");
                };

                const onPhaseChange = (nextPhase) => {
                    if (sessionRef.current !== mySession) return;
                    if (nextPhase !== "REVEALING") {
                        setPhase(nextPhase);
                    }
                };

                const started3D =
                    window.DivinationStage &&
                    typeof window.DivinationStage.invokeCosmicOracle === 'function' &&
                    window.DivinationStage.invokeCosmicOracle(num, onRevealed, onPhaseChange);

                // WebGL 載入失敗時的安全降級方案
                if (!started3D) {
                    setFallbackMode(true);
                    fallbackTimerRef.current = setTimeout(() => {
                        if (sessionRef.current !== mySession) return;
                        setPhase("SHAKING");
                        fallbackTimerRef.current = setTimeout(onRevealed, 900);
                    }, 450);
                }
            };

            const resetRitual = () => {
                sessionRef.current++;
                if (fallbackTimerRef.current) clearTimeout(fallbackTimerRef.current);
                if (tlRef.current) tlRef.current.kill();
                setPhase("IDLE");
                if (window.DivinationStage && typeof window.DivinationStage.resetCosmicOracle === 'function') {
                    window.DivinationStage.resetCosmicOracle();
                }
            };

            const formattedOracleLabel =
                window.DivinationStage && typeof window.DivinationStage.formatOracleIndex === 'function'
                    ? window.DivinationStage.formatOracleIndex(oracleNo)
                    : `星 象 · ${oracleNo}`;

            return (
                <div
                    className="flex-1 flex flex-col items-center justify-between w-full max-w-3xl mx-auto px-4 pt-6 pb-10 min-h-[calc(100dvh-150px)]"
                    data-ritual-phase={phase}
                >
                    {/* 頂部標題 */}
                    <div className="text-center animate-ink-reveal">
                        <p className="font-latin text-[10px] md:text-xs tracking-[0.38em] text-[#c8a46b]/80 uppercase mb-2">
                            COSMIC GUIDANCE · CELESTIAL ASTROLABE
                        </p>
                        <p className="text-sm md:text-base text-[#efece6]/85 tracking-[0.22em] font-light">
                            {ORACLE_PHASE_LABELS[phase]}
                        </p>
                    </div>

                    {/* 中央區：感應中留給 3D 玄銅渾天星儀；REVEALING / RESULT 展開宣紙卷軸 */}
                    <div className="flex-1 flex items-center justify-center w-full my-6">
                        {showScroll ? (
                            <div className="scroll-container">
                                <div className="scroll-rod" aria-hidden="true" />
                                <div ref={scrollPaperRef} className="scroll-paper-wrapper">
                                    <div className="scroll-paper text-center flex flex-col items-center justify-center">
                                        <div className="w-full">
                                            <div ref={stampRef} className="mb-4 opacity-0">
                                                <span className="cinnabar-stamp">{formattedOracleLabel}</span>
                                            </div>
                                            <p
                                                ref={mainTextRef}
                                                className="text-xl md:text-2xl font-normal text-[#efece6] leading-relaxed tracking-[0.12em] mb-4 opacity-0"
                                            >
                                                {currentGuide.main}
                                            </p>
                                            <div className="gold-hairline w-24 mx-auto my-4"></div>
                                            <p
                                                ref={subTextRef}
                                                className="text-xs md:text-sm text-[#e6cca0]/85 leading-relaxed tracking-[0.14em] font-light max-w-lg mx-auto opacity-0"
                                            >
                                                {currentGuide.sub}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                                <div className="scroll-rod" aria-hidden="true" />
                            </div>
                        ) : (
                            <div className="min-h-[250px] md:min-h-[310px] w-full flex items-center justify-center pointer-events-none">
                                {fallbackMode && (
                                    <div className={`w-36 h-36 rounded-full border border-[#c8a46b]/45 bg-[#121318]/90 flex items-center justify-center text-[#e6cca0] tracking-[0.26em] text-xs ${phase === 'SHAKING' ? 'animate-spin' : ''}`}>
                                        宇宙指引
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* 底部儀式進度與操作區 */}
                    <div className="flex flex-col items-center gap-4">
                        {isBusy && (
                            <div className="flex items-center gap-1.5">
                                {['PRAYING', 'SHAKING', 'EXTRACTING', 'FLOATING', 'REVEALING'].map((step) => (
                                    <span
                                        key={step}
                                        className={`h-1 rounded-full transition-all duration-300 ${
                                            phase === step ? 'w-5 bg-[#e6cca0]' : 'w-1.5 bg-[#c8a46b]/25'
                                        }`}
                                    />
                                ))}
                            </div>
                        )}

                        {phase === "RESULT" ? (
                            <button
                                onClick={resetRitual}
                                className="ritual-btn rounded-full py-3.5 text-sm animate-ink-reveal"
                            >
                                再 啟 星 儀
                            </button>
                        ) : (
                            <button
                                onClick={getGuide}
                                disabled={isBusy}
                                className="ritual-btn ritual-btn-primary rounded-full py-3.5 text-sm"
                            >
                                {isBusy ? '感 應 中' : '接 收 指 引'}
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // =====================================================================
        // 主程式 App — 統一玄墨暗金世界觀與單一 WebGL 舞台同步
        // =====================================================================
        const App = () => {
            const getTabFromHash = () => {
                const h = window.location.hash.replace('#', '');
                return ['blocks', 'cards', 'guide'].includes(h) ? h : 'blocks';
            };
            const [activeTab, setActiveTab] = useState(getTabFromHash);
            const [soundOn, setSoundOn] = useState(false);
            const [reducedMotion, setReducedMotion] = useState(
                () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
            );

            // 監聽瀏覽器返回上一頁（popstate / hashchange），正確還原對應分頁與 3D 場景
            useEffect(() => {
                const onHashOrPop = () => {
                    setActiveTab(getTabFromHash());
                };
                window.addEventListener('hashchange', onHashOrPop);
                window.addEventListener('popstate', onHashOrPop);
                return () => {
                    window.removeEventListener('hashchange', onHashOrPop);
                    window.removeEventListener('popstate', onHashOrPop);
                };
            }, []);

            const switchTab = (tab) => {
                if (tab === activeTab) return;
                if (window.location.hash !== `#${tab}`) {
                    window.history.pushState({ tab }, '', `#${tab}`);
                }
                setActiveTab(tab);
            };

            // 切換分頁時同步通知 3D 舞台切換場景與色溫
            useEffect(() => {
                const syncMode = () => {
                    if (window.DivinationStage && typeof window.DivinationStage.setMode === 'function') {
                        window.DivinationStage.setMode(activeTab);
                    }
                };
                syncMode();
                window.addEventListener('divination-stage-ready', syncMode);
                return () => window.removeEventListener('divination-stage-ready', syncMode);
            }, [activeTab]);

            const handleToggleSound = () => {
                if (window.DivinationStage && typeof window.DivinationStage.toggleSound === 'function') {
                    const next = window.DivinationStage.toggleSound();
                    setSoundOn(next);
                }
            };

            const handleToggleMotion = () => {
                const next = !reducedMotion;
                setReducedMotion(next);
                if (window.DivinationStage && typeof window.DivinationStage.setReducedMotion === 'function') {
                    window.DivinationStage.setReducedMotion(next);
                }
            };

            return (
                <div className="min-h-[100dvh] w-full flex flex-col relative">
                    {/* 頂部極簡懸浮儀式導覽列（手機 390px 單行不折行） */}
                    <header className="w-full sticky top-0 z-30 border-b border-[#c8a46b]/15 bg-[#070709]/65 backdrop-blur-md">
                        <div className="max-w-5xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between gap-2">
                            {/* 品牌印記 */}
                            <div className="flex items-center gap-2 sm:gap-3 shrink-0">
                                <div className="w-7 h-7 rounded-full border border-[#c8a46b]/50 flex items-center justify-center text-[11px] text-[#e6cca0] font-serif-tc shrink-0">
                                    問
                                </div>
                                <div className="leading-tight whitespace-nowrap">
                                    <h1 className="text-xs sm:text-base font-medium tracking-[0.16em] sm:tracking-[0.28em] text-[#efece6]">
                                        靈感問路站
                                    </h1>
                                    <p className="font-latin text-[9px] tracking-[0.22em] text-[#8e8a82] uppercase hidden sm:block">
                                        Digital Divination
                                    </p>
                                </div>
                            </div>

                            {/* 三大儀式切換 */}
                            <nav className="flex items-center h-full gap-0.5 sm:gap-5 shrink-0">
                                <button
                                    onClick={() => switchTab('blocks')}
                                    className={`nav-tab h-full px-2 sm:px-3 flex items-center gap-1 sm:gap-1.5 text-[11px] sm:text-xs tracking-[0.12em] sm:tracking-[0.22em] whitespace-nowrap ${activeTab === 'blocks' ? 'active' : ''}`}
                                >
                                    <span className="hidden xs:inline-flex sm:inline-flex"><Icons.Moon /></span>
                                    <span>擲筊</span>
                                </button>
                                <button
                                    onClick={() => switchTab('cards')}
                                    className={`nav-tab h-full px-2 sm:px-3 flex items-center gap-1 sm:gap-1.5 text-[11px] sm:text-xs tracking-[0.12em] sm:tracking-[0.22em] whitespace-nowrap ${activeTab === 'cards' ? 'active' : ''}`}
                                >
                                    <span className="hidden xs:inline-flex sm:inline-flex"><Icons.Cards /></span>
                                    <span>三元牌</span>
                                </button>
                                <button
                                    onClick={() => switchTab('guide')}
                                    className={`nav-tab h-full px-1.5 sm:px-3 flex items-center gap-1 sm:gap-1.5 text-[11px] sm:text-xs tracking-[0.08em] sm:tracking-[0.22em] whitespace-nowrap ${activeTab === 'guide' ? 'active' : ''}`}
                                >
                                    <span className="hidden xs:inline-flex sm:inline-flex"><Icons.Compass /></span>
                                    <span>宇宙指引</span>
                                </button>
                            </nav>

                            {/* 右側音效與動效微控制 */}
                            <div className="flex items-center gap-1.5">
                                <button
                                    onClick={handleToggleSound}
                                    title={soundOn ? '關閉儀式音效' : '開啟儀式音效'}
                                    className={`p-2 rounded-full border transition-colors ${
                                        soundOn
                                            ? 'border-[#c8a46b]/55 text-[#e6cca0] bg-[#c8a46b]/15'
                                            : 'border-white/10 text-[#8e8a82] hover:text-[#efece6]'
                                    }`}
                                >
                                    {soundOn ? <Icons.VolumeOn /> : <Icons.VolumeOff />}
                                </button>
                                <button
                                    onClick={handleToggleMotion}
                                    title={reducedMotion ? '切換標準動態' : '切換靜謐簡約動態'}
                                    className={`hidden sm:inline-flex px-2.5 py-1 rounded-full border text-[10px] tracking-[0.18em] transition-colors ${
                                        reducedMotion
                                            ? 'border-[#c8a46b]/55 text-[#e6cca0] bg-[#c8a46b]/15'
                                            : 'border-white/10 text-[#8e8a82] hover:text-[#efece6]'
                                    }`}
                                >
                                    {reducedMotion ? '靜謐' : '動效'}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* 主儀式舞台 */}
                    <main className="flex-1 flex flex-col w-full">
                        {activeTab === 'blocks' && <MoonBlocks />}
                        {activeTab === 'cards' && <TriadCards />}
                        {activeTab === 'guide' && <RandomGuide />}
                    </main>

                    {/* 底部低調落款 */}
                    <footer className="w-full text-center py-4 text-[11px] tracking-[0.32em] text-[#8e8a82]/55">
                        <p>心誠則靈 · 僅供參考</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
