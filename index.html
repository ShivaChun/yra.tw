<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靈感問路站 | 擲筊・三元牌・指引</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap'); /* For Latin Card Names */
        
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #f4f4f0;
            color: #4a4a4a;
        }

        /* --- Animations --- */
        @keyframes toss {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-50px) rotate(180deg); }
            50% { transform: translateY(0) rotate(360deg); }
            75% { transform: translateY(-20px) rotate(540deg); }
            100% { transform: translateY(0) rotate(720deg); }
        }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            50% { transform: rotate(0eg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px) translateX(0px); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100px) translateX(20px); opacity: 0; }
        }

        /* Flip Animation */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }

        .animate-toss { animation: toss 0.8s ease-in-out; }
        .animate-shake { animation: shake 0.3s infinite; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }

        /* --- Moon Block Styles (Wabi-Sabi) --- */
        .moon-block {
            width: 80px;
            height: 40px;
            border-radius: 2px 2px 40px 40px;
            transition: all 0.5s ease;
            position: relative;
        }
        
        .block-round {
            background-color: #a05248;
            box-shadow: inset 0 -4px 8px rgba(0,0,0,0.1);
            transform: rotateX(0deg); 
        }

        .block-flat {
            background-color: #dcd0c0;
            border: 2px solid #a05248;
            transform: rotateX(180deg); 
        }

        /* --- Particle Styles (Cosmic) --- */
        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(1px);
        }

        .nav-active {
            color: #595959;
            border-bottom: 1px solid #595959;
        }
        
        .nav-item {
            color: #a0a0a0;
            transition: all 0.3s;
        }
        
        .nav-item:hover {
            color: #707070;
        }

        /* Card Text Font */
        .font-latin {
            font-family: 'Cinzel', serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Icons
        const Icons = {
            Moon: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>,
            Cards: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M8 2v20"/><path d="M20 12h-8"/><path d="M4 12h-2"/></svg>,
            Compass: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        };

        // --- Components ---

        // 1. Moon Blocks (Wabi-Sabi Style)
        const MoonBlocks = () => {
            const [status, setStatus] = useState("ready"); 
            const [blocks, setBlocks] = useState([0, 0]); 
            const [resultText, setResultText] = useState("");
            const [resultDesc, setResultDesc] = useState("");

            const toss = () => {
                if (status === "tossing") return;
                setStatus("tossing");
                setResultText("");
                setResultDesc("");

                setTimeout(() => {
                    const b1 = Math.random() > 0.5 ? 1 : 0;
                    const b2 = Math.random() > 0.5 ? 1 : 0;
                    setBlocks([b1, b2]);
                    
                    const sum = b1 + b2;
                    let text = "";
                    let desc = "";

                    if (sum === 1) {
                        text = "聖筊";
                        desc = "所願可成，心誠則靈。";
                    } else if (sum === 2) {
                        text = "笑筊";
                        desc = "機緣未定，或再三思。";
                    } else {
                        text = "陰筊";
                        desc = "時機未到，靜候佳音。";
                    }

                    setResultText(text);
                    setResultDesc(desc);
                    setStatus("result");
                }, 800);
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-[500px] font-serif bg-[#f4f4f0]">
                    <div className="mb-12 text-center">
                        <p className="text-[#888] text-sm tracking-widest mb-2 font-light">HEART SINCERITY</p>
                        <p className="text-[#555] tracking-widest">默念姓名與所求之事</p>
                    </div>

                    <div className="flex gap-10 mb-12 h-24 items-center">
                        <div className={`moon-block ${status === 'tossing' ? 'animate-toss' : ''} ${blocks[0] === 1 ? 'block-flat' : 'block-round'}`}></div>
                        <div className={`moon-block ${status === 'tossing' ? 'animate-toss' : ''} ${blocks[1] === 1 ? 'block-flat' : 'block-round'}`}></div>
                    </div>

                    {status === "result" && (
                        <div className="text-center animate-fade-in mb-8">
                            <h2 className="text-3xl font-light text-[#a05248] mb-2 tracking-[0.2em]">{resultText}</h2>
                            <div className="w-8 h-[1px] bg-[#dcd0c0] mx-auto my-3"></div>
                            <p className="text-[#777] text-sm tracking-wider">{resultDesc}</p>
                        </div>
                    )}

                    <button 
                        onClick={toss}
                        disabled={status === 'tossing'}
                        className="bg-[#6b6b6b] hover:bg-[#555] text-[#f4f4f0] text-sm tracking-widest py-3 px-10 transition-colors duration-500 disabled:opacity-50 disabled:cursor-not-allowed outline-none rounded-sm"
                    >
                        {status === 'tossing' ? '...' : '擲 筊'}
                    </button>
                </div>
            );
        };

        // 2. Triad Cards (三元牌)
        const TriadCards = () => {
            const [stage, setStage] = useState('selection'); // selection, sub-selection, result
            const [selectedMain, setSelectedMain] = useState(null);
            const [subResult, setSubResult] = useState(null);
            const [shuffling, setShuffling] = useState(false);

            const mainCards = [
                { 
                    id: 'origin', 
                    title: 'Origo Animae', 
                    zhTitle: '靈魂的起源', 
                    img: 'https://img.yra.tw/x/Origo%20Animae-2.png' 
                },
                { 
                    id: 'bond', 
                    title: 'Transmutatio Vinculi', 
                    zhTitle: '連結的轉變', 
                    img: 'https://img.yra.tw/x/Transmutatio%20Vinculi-2.png' 
                },
                { 
                    id: 'future', 
                    title: 'Realis Futura', 
                    zhTitle: '未來的實現', 
                    img: 'https://img.yra.tw/x/Reakis%20Futura-2.png' // Keeping original URL
                }
            ];

            const subCards = [
                { id: 'arbor', title: 'Arbor', img: 'https://img.yra.tw/x/Arbor-1.png' },
                { id: 'astra', title: 'ASTRA', img: 'https://img.yra.tw/x/ASTRA-2.png' },
                { id: 'semen', title: 'Semen', img: 'https://img.yra.tw/x/Semen02.png' }
            ];

            const handleMainSelect = (card) => {
                setSelectedMain(card);
                setStage('sub-selection');
            };

            const handleSubDraw = () => {
                if (shuffling) return;
                setShuffling(true);
                // Simulate shuffle/draw delay
                setTimeout(() => {
                    const randomSub = subCards[Math.floor(Math.random() * subCards.length)];
                    setSubResult(randomSub);
                    setShuffling(false);
                    setStage('result');
                }, 1000);
            };

            const reset = () => {
                setStage('selection');
                setSelectedMain(null);
                setSubResult(null);
            };

            return (
                <div className="flex flex-col items-center min-h-[500px] w-full animate-fade-in">
                    
                    {/* Header Instruction */}
                    <div className="text-center mb-8 px-4">
                        <p className="text-[#a0a0a0] text-xs font-latin tracking-[0.2em] mb-2 uppercase">Triad Oracle</p>
                        <h2 className="text-xl font-medium text-[#444] tracking-widest">
                            {stage === 'selection' && "依照你目前生活的感受，選出最優先的順序"}
                            {stage === 'sub-selection' && "針對此面向，請抽取一張副牌"}
                            {stage === 'result' && "三元牌指引"}
                        </h2>
                    </div>

                    {/* Stage 1: Main Card Selection */}
                    {stage === 'selection' && (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl px-4">
                            {mainCards.map((card) => (
                                <div 
                                    key={card.id}
                                    onClick={() => handleMainSelect(card)}
                                    className="group cursor-pointer flex flex-col items-center transition-all duration-300 transform hover:-translate-y-2"
                                >
                                    <div className="w-full aspect-[2/3] rounded-lg overflow-hidden shadow-md group-hover:shadow-xl transition-all relative bg-[#e8e4dc]">
                                        <div className="absolute inset-0 bg-black opacity-0 group-hover:opacity-10 transition-opacity z-10"></div>
                                        <img src={card.img} alt={card.title} className="w-full h-full object-cover" />
                                    </div>
                                    <h3 className="mt-4 font-latin text-sm font-bold text-[#555] tracking-widest">{card.title}</h3>
                                    <p className="text-xs text-[#888] mt-1 tracking-wider">{card.zhTitle}</p>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Stage 2: Sub Card Selection */}
                    {stage === 'sub-selection' && selectedMain && (
                        <div className="flex flex-col items-center w-full animate-fade-in">
                            {/* Selected Context */}
                            <div className="flex items-center gap-4 mb-10 opacity-70 scale-90">
                                <img src={selectedMain.img} alt={selectedMain.title} className="w-16 h-24 object-cover rounded shadow" />
                                <div className="text-left">
                                    <p className="text-xs text-[#888]">已選擇主牌</p>
                                    <p className="font-latin font-bold text-[#555]">{selectedMain.title}</p>
                                </div>
                            </div>

                            {/* Face Down Cards */}
                            <div className="flex gap-4 justify-center">
                                {[1, 2, 3].map((i) => (
                                    <div 
                                        key={i}
                                        onClick={handleSubDraw}
                                        className={`w-28 h-44 bg-[#2a2a2a] rounded-lg border-2 border-[#555] cursor-pointer shadow-lg transition-all duration-500 transform hover:-translate-y-2 relative overflow-hidden group ${shuffling ? 'animate-pulse' : ''}`}
                                    >
                                        <div className="absolute inset-0 flex items-center justify-center">
                                            <div className="w-16 h-16 border border-[#444] rounded-full flex items-center justify-center">
                                                <div className="w-12 h-12 border border-[#444] rounded-full rotate-45"></div>
                                            </div>
                                        </div>
                                        <div className="absolute inset-0 bg-white opacity-0 group-hover:opacity-5 transition-opacity"></div>
                                    </div>
                                ))}
                            </div>
                            <p className="mt-8 text-xs text-[#999] tracking-widest animate-pulse">點擊任意卡背抽取</p>
                        </div>
                    )}

                    {/* Stage 3: Result */}
                    {stage === 'result' && selectedMain && subResult && (
                        <div className="flex flex-col items-center w-full max-w-lg px-6 animate-fade-in">
                            <div className="flex flex-col md:flex-row gap-8 items-center justify-center mb-8">
                                {/* Main Card Display */}
                                <div className="flex flex-col items-center">
                                    <p className="text-xs text-[#999] mb-2 tracking-widest uppercase">Theme</p>
                                    <div className="w-40 aspect-[2/3] rounded-lg overflow-hidden shadow-lg mb-3">
                                        <img src={selectedMain.img} alt={selectedMain.title} className="w-full h-full object-cover" />
                                    </div>
                                    <h4 className="font-latin text-xs font-bold text-[#666]">{selectedMain.title}</h4>
                                    <p className="text-[10px] text-[#999]">{selectedMain.zhTitle}</p>
                                </div>

                                {/* Arrow */}
                                <div className="text-[#ccc]">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                                </div>

                                {/* Sub Card Display */}
                                <div className="flex flex-col items-center">
                                    <p className="text-xs text-[#999] mb-2 tracking-widest uppercase">Insight</p>
                                    <div className="w-40 aspect-[2/3] rounded-lg overflow-hidden shadow-lg mb-3 ring-2 ring-[#a05248] ring-offset-4 ring-offset-[#f4f4f0]">
                                        <img src={subResult.img} alt={subResult.title} className="w-full h-full object-cover" />
                                    </div>
                                    <h4 className="font-latin text-xs font-bold text-[#a05248]">{subResult.title}</h4>
                                </div>
                            </div>
                            
                            <button 
                                onClick={reset}
                                className="mt-4 px-8 py-2 border border-[#ccc] text-[#888] rounded-full text-xs tracking-widest hover:bg-[#e0e0e0] hover:text-[#555] transition-colors"
                            >
                                重新抽牌
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // 3. Random Guide (Cosmic Mystery Style)
        const RandomGuide = () => {
            const [status, setStatus] = useState("ready");
            const [guide, setGuide] = useState("");
            const [particles, setParticles] = useState([]);
            
            const guides = [
                "衝了，不要猶豫", "現在不是時候", "問問長輩的意見", "睡一覺再決定",
                "相信你的直覺", "這是一個轉機", "保持現狀", "大膽嘗試新方法",
                "先去吃頓好吃的", "放棄也是一種選擇", "有人正在等你開口", "再堅持一下",
                "換個角度想", "答案就在你心裡", "小心細節", "大吉大利，去做吧"
            ];

            useEffect(() => {
                const newParticles = [];
                for(let i=0; i<30; i++){
                    newParticles.push({
                        id: i,
                        top: Math.random() * 100 + '%',
                        left: Math.random() * 100 + '%',
                        size: Math.random() * 3 + 1 + 'px',
                        duration: Math.random() * 3 + 2 + 's',
                        delay: Math.random() * 2 + 's'
                    });
                }
                setParticles(newParticles);
            }, []);

            const getGuide = () => {
                setStatus("thinking");
                
                let count = 0;
                const interval = setInterval(() => {
                    setGuide(guides[Math.floor(Math.random() * guides.length)]);
                    count++;
                    if(count > 15) { 
                        clearInterval(interval);
                        setStatus("result");
                    }
                }, 80);
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-[500px] relative overflow-hidden rounded-xl">
                    <div className="absolute inset-0 bg-gradient-to-b from-[#0f0c29] via-[#302b63] to-[#24243e] z-0"></div>
                    
                    {particles.map(p => (
                        <div key={p.id} className="particle" style={{
                            top: p.top, 
                            left: p.left, 
                            width: p.size, 
                            height: p.size,
                            animation: `float ${p.duration} ease-in-out infinite`,
                            animationDelay: p.delay
                        }}></div>
                    ))}

                    <div className="mb-10 text-center relative z-10">
                        <p className="text-indigo-200 text-sm tracking-widest opacity-80">COSMIC GUIDANCE</p>
                        <p className="text-white text-lg tracking-wider font-light mt-1">宇宙指引</p>
                    </div>

                    <div className="relative mb-12 group z-10">
                        <div className="w-56 h-56 rounded-full flex items-center justify-center relative backdrop-blur-sm border border-indigo-400/30 shadow-[0_0_50px_rgba(76,29,149,0.5)] transition-all duration-1000">
                             <div className="absolute inset-0 rounded-full bg-gradient-to-tr from-indigo-900/50 to-purple-500/10"></div>
                             
                             <div className="text-center px-6 relative">
                                {status === 'ready' && (
                                    <span className="text-indigo-200 text-7xl opacity-20 font-thin animate-pulse">?</span>
                                )}
                                {status !== 'ready' && (
                                    <p className={`text-2xl font-bold text-white leading-relaxed drop-shadow-[0_0_10px_rgba(255,255,255,0.8)] tracking-wider ${status === 'thinking' ? 'opacity-50' : 'animate-fade-in'}`}>
                                        {guide}
                                    </p>
                                )}
                            </div>
                        </div>
                        <div className="absolute -inset-4 border border-indigo-300/10 rounded-full animate-[spin_10s_linear_infinite]"></div>
                        <div className="absolute -inset-8 border border-purple-300/5 rounded-full animate-[spin_15s_linear_infinite_reverse]"></div>
                    </div>

                    <button 
                        onClick={getGuide}
                        disabled={status === 'thinking'}
                        className="relative z-10 bg-indigo-500/20 hover:bg-indigo-500/40 border border-indigo-400/50 text-indigo-100 py-3 px-10 rounded-full backdrop-blur-md transition-all duration-300 hover:shadow-[0_0_20px_rgba(99,102,241,0.4)] disabled:opacity-30 tracking-widest text-sm"
                    >
                        {status === 'thinking' ? '接收訊號中...' : '感應宇宙'}
                    </button>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState("blocks"); 

            // Dynamic header style based on tab
            const getHeaderStyle = () => {
                if (activeTab === 'guide') return "bg-[#0f0c29] text-indigo-100 border-b border-indigo-900";
                if (activeTab === 'blocks') return "bg-[#f4f4f0] text-[#555]";
                return "bg-[#f4f4f0] text-[#555]"; // Triad Cards uses neutral light theme
            };

            return (
                <div className="max-w-2xl mx-auto min-h-screen bg-[#f4f4f0] shadow-2xl relative font-sans transition-colors duration-500">
                    
                    {/* Header: Adapts to style */}
                    <header className={`p-6 text-center transition-colors duration-500 relative overflow-hidden ${getHeaderStyle()}`}>
                        <div className="relative z-10">
                            <h1 className="text-2xl font-medium tracking-[0.3em] mb-1 font-serif">靈感問路站</h1>
                            <p className="text-[10px] opacity-60 tracking-[0.2em] uppercase font-sans">Divination & Guidance</p>
                        </div>
                    </header>

                    {/* Minimalist Navigation */}
                    <nav className="flex justify-around bg-[#fcfcfc] border-b border-[#eaeaea] sticky top-0 z-20">
                        <button 
                            onClick={() => setActiveTab('blocks')}
                            className={`flex flex-col items-center p-4 w-1/3 transition-all duration-300 text-xs tracking-widest ${activeTab === 'blocks' ? 'nav-active' : 'nav-item'}`}
                        >
                            <Icons.Moon />
                            <span className="mt-2">擲筊</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('cards')}
                            className={`flex flex-col items-center p-4 w-1/3 transition-all duration-300 text-xs tracking-widest ${activeTab === 'cards' ? 'nav-active' : 'nav-item'}`}
                        >
                            <Icons.Cards />
                            <span className="mt-2">三元牌</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('guide')}
                            className={`flex flex-col items-center p-4 w-1/3 transition-all duration-300 text-xs tracking-widest ${activeTab === 'guide' ? 'nav-active' : 'nav-item'}`}
                        >
                            <Icons.Compass />
                            <span className="mt-2">指引</span>
                        </button>
                    </nav>

                    {/* Main Content Area */}
                    <main className="p-4 sm:p-8">
                        <div className="bg-white rounded-lg shadow-[0_5px_30px_rgba(0,0,0,0.03)] overflow-hidden transition-all duration-500">
                            {activeTab === 'blocks' && <MoonBlocks />}
                            {activeTab === 'cards' && <TriadCards />}
                            {activeTab === 'guide' && <RandomGuide />}
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="text-center p-8 text-[#a0a0a0] text-xs font-light tracking-widest">
                        <p>心誠則靈 · 僅供參考</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
