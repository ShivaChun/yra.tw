                        title: "Velum Astrae", zhTitle: "星辰面紗",
                        poem: "樹影遮蔽星途，預言如風掠過，\n種子回歸土中，孕育新的輪迴。\n現在黯然，指引未來回溯根源。",
                        note: "現在遮蔽了未來，回歸種子——用輪迴重塑平衡。"
                    },
                    "astra-semen-arbor": {
                        title: "Cadens Seminis", zhTitle: "種子墜落",
                        poem: "星辰的墜落，攪動種子的沉睡，\n樹枝伸展，捕捉遺落的輝芒。\n未來不滿，指引起源化作綠焰。",
                        note: "未來攪動了起源，樹枝捕捉——轉化墜落為新生力量。"
                    },
                    "astra-arbor-semen": {
                        title: "Wurzelstern", zhTitle: "根源之星",
                        poem: "預言之星，纏繞樹木的枝蔓，\n種子深藏，等待循環的召喚。\n未來朦朧，指引現在回歸塵土。",
                        note: "未來纏繞著現在，回歸種子——在等待中尋找召喚。"
                    }
                }
            };

            const isReduced = () =>
                window.DivinationStage && typeof window.DivinationStage.getReducedMotion === 'function'
                    ? window.DivinationStage.getReducedMotion()
                    : false;

            useEffect(() => {
                [...mainCardsData, ...subCardsData].forEach((c) => {
                    const img = new Image();
                    img.src = c.img;
                });
                return () => {
                    sessionRef.current++;
                    if (tlRef.current) tlRef.current.kill();
                };
            }, []);

            // 同步三元牌狀態至 3D 魔法召喚舞台
            useEffect(() => {
                if (window.DivinationStage && typeof window.DivinationStage.syncTriadCardState === 'function') {
                    const activeIds = stage === 'main-reveal' ? mainOrder : stage === 'final-reveal' ? subOrder : [];
                    const colors = activeIds.map((id) => (CARD_SUMMON_THEMES[id] || CARD_SUMMON_THEMES.origin).color);
                    window.DivinationStage.syncTriadCardState(cardPhase, stage, colors);
                }
            }, [cardPhase, stage]);

            useEffect(() => {
                const count =
                    stage === 'main-select'
                        ? mainOrder.length
                        : stage === 'sub-select'
                        ? subOrder.length
                        : 3;
                if (window.DivinationStage && typeof window.DivinationStage.notifyCardSelection === 'function') {
                    window.DivinationStage.notifyCardSelection(count);
                }
            }, [stage, mainOrder.length, subOrder.length]);

            // 選牌階段佈陣：SHUFFLING → SELECTING
            useEffect(() => {
                if (stage !== 'main-select' && stage !== 'sub-select') {
                    if (stage === 'final-overview') setStageSceneTone('luminous');
                    return;
                }
                const mySession = ++sessionRef.current;
                if (tlRef.current) tlRef.current.kill();

                setStageSceneTone('ethereal');
                setCardPhase('SHUFFLING');

                const reduced = isReduced();
                if (window.gsap && selectDeckRef.current) {
                    const slots = selectDeckRef.current.querySelectorAll('.deck-card-slot');
                    const inners = selectDeckRef.current.querySelectorAll('.deck-card-inner');
                    const sheens = selectDeckRef.current.querySelectorAll('.deck-sheen');
                    const captions = selectDeckRef.current.querySelectorAll('.deck-card-caption');
                    const isMobile = window.innerWidth < 768;
                    const stackSpan = isMobile ? 42 : 205;

                    const tl = window.gsap.timeline({
                        onComplete: () => {
                            if (sessionRef.current === mySession) {
                                window.gsap.set([slots, inners], { clearProps: 'transform' });
                                setCardPhase('SELECTING');
                            }
                        }
                    });
                    tlRef.current = tl;

                    if (reduced) {
                        tl.fromTo(slots, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, stagger: 0.05 });
                    } else {
                        window.gsap.set(captions, { opacity: 0, y: 8 });
                        window.gsap.set(inners, { rotateY: 180, rotateZ: (i) => (i - 1) * 4 });

                        tl.fromTo(
                            slots,
                            { opacity: 0, y: 36, scale: 0.86, x: (i) => (1 - i) * stackSpan },
                            {
                                opacity: 1,
                                y: -6,
                                scale: 0.95,
                                x: (i) => (1 - i) * stackSpan * 0.9,
                                duration: 0.32,
                                ease: 'power3.out',
                                onStart: () => window.DivinationStage && window.DivinationStage.playCardRevealSound()
                            }
                        );

                        tl.to(slots, {
                            x: (i) => (i === 0 ? stackSpan * 0.4 : i === 2 ? -stackSpan * 0.4 : 0),
                            y: (i) => (i === 1 ? -18 : 4),
                            scale: 0.98,
                            duration: 0.26,
                            ease: 'sine.inOut'
                        });

                        tl.to(slots, {
                            x: 0,
                            y: 0,
                            scale: 1,
                            duration: 0.42,
                            stagger: 0.06,
                            ease: 'expo.out'
                        });

                        tl.to(inners, { rotateY: 0, rotateZ: 0, duration: 0.64, stagger: 0.08, ease: 'expo.inOut' }, '-=0.2');
                        tl.fromTo(
                            sheens,
                            { xPercent: -130, opacity: 0 },
                            { xPercent: 130, opacity: 0.82, duration: 0.55, stagger: 0.08, ease: 'power2.inOut' },
                            '-=0.55'
                        );
                        tl.to(captions, { opacity: 1, y: 0, duration: 0.35, stagger: 0.06 }, '-=0.22');
                    }
                } else {
                    setCardPhase('SELECTING');
                }

                return () => {
                    if (tlRef.current) tlRef.current.kill();
                };
            }, [stage]);

            // 六階段奇幻魔法卡牌召喚演出：
            // MAGIC_CIRCLE → ENERGY_GATHERING → CARD_MATERIALIZATION → CARD_AWAKENING → CARD_REVEAL → RESULT
            useEffect(() => {
                if (stage !== 'main-reveal' && stage !== 'final-reveal') return;
                const mySession = ++sessionRef.current;
                if (tlRef.current) tlRef.current.kill();

                const reduced = isReduced();
                const chosenIds = stage === 'main-reveal' ? mainOrder : subOrder;

                // 儀式啟動：柔和轉暗進入星夜聚光舞台，凸顯幾何魔法陣與召喚光芒
                setStageSceneTone('dusk');
                setCardPhase('MAGIC_CIRCLE');

                if (window.gsap && revealGridRef.current) {
                    const cardInners = revealGridRef.current.querySelectorAll('.reveal-card-inner');
                    const sheens = revealGridRef.current.querySelectorAll('.reveal-sheen');
                    const titles = revealGridRef.current.querySelectorAll('.reveal-card-title');

                    // 初始隱藏卡牌，讓舞台先完整呈現「1. 幾何魔法陣展開」與「2. 螺旋能量向中央聚集」
                    window.gsap.set(cardInners, {
                        opacity: 0,
                        scale: 0.68,
                        y: 36,
                        z: -60,
                        rotateY: 180,
                        filter: 'brightness(2.4) blur(6px)'
                    });
                    window.gsap.set(titles, { opacity: 0, y: 8 });

                    const tl = window.gsap.timeline();
                    tlRef.current = tl;

                    // Stage 1: MAGIC_CIRCLE (0.76s) — 幾何魔法陣展開
                    tl.to({}, { duration: reduced ? 0.15 : 0.76 });

                    // Stage 2: ENERGY_GATHERING (0.74s) — 星塵與能量向中央聚集
                    tl.call(() => {
                        if (sessionRef.current === mySession) setCardPhase('ENERGY_GATHERING');
                    });
                    tl.to({}, { duration: reduced ? 0.15 : 0.74 });

                    // Stage 3: CARD_MATERIALIZATION (0.78s) — 卡牌從光芒中逐漸凝結成形
                    tl.call(() => {
                        if (sessionRef.current === mySession) {
                            setCardPhase('CARD_MATERIALIZATION');
                            if (window.DivinationStage) window.DivinationStage.playCardRevealSound();
                        }
                    });
                    tl.to(cardInners, {
                        opacity: 1,
                        scale: 1.03,
                        y: -14,
                        z: 24,
                        rotateY: 180,
                        filter: 'brightness(1) blur(0px)',
                        duration: reduced ? 0.25 : 0.78,
                        stagger: reduced ? 0.05 : 0.12,
                        ease: 'power3.out'
                    });

                    // Stage 4: CARD_AWAKENING (0.76s) — 卡牌懸浮中央、邊緣出現流動魔法光芒並微幅蓄勢旋轉
                    tl.call(() => {
                        if (sessionRef.current === mySession) {
                            setCardPhase('CARD_AWAKENING');
                            if (window.DivinationStage) window.DivinationStage.playRuneSound(5);
                        }
                    });
                    tl.to(cardInners, {
                        rotateY: 196,
                        rotateX: 7,
                        y: -20,
                        z: 36,
                        duration: reduced ? 0.2 : 0.76,
                        stagger: 0.06,
                        ease: 'sine.inOut'
                    });

                    // Stage 5: CARD_REVEAL — 光影爆發、卡牌翻轉揭示正面圖案（翻開前嚴格零劇透）
                    tl.call(() => {
                        if (sessionRef.current === mySession) setCardPhase('CARD_REVEAL');
                    });

                    const revealStart = tl.duration();
                    cardInners.forEach((inner, i) => {
                        const tAt = revealStart + i * (reduced ? 0.1 : 0.34);
                        const cTheme = CARD_SUMMON_THEMES[chosenIds[i]] || CARD_SUMMON_THEMES.origin;

                        if (reduced) {
                            tl.to(inner, { rotateY: 0, rotateX: 0, y: 0, z: 0, scale: 1, duration: 0.3 }, tAt);
                        } else {
                            tl.to(
                                inner,
                                {
                                    rotateY: 90,
                                    rotateX: 2,
                                    y: -26,
                                    z: 70,
                                    scale: 1.09,
                                    duration: 0.32,
                                    ease: 'power2.in',
                                    onComplete: () => {
                                        if (sessionRef.current === mySession && window.DivinationStage) {
                                            window.DivinationStage.triggerCardFlipImpulse(i, cTheme.hex);
                                            window.DivinationStage.playCardRevealSound();
                                        }
                                    }
                                },
                                tAt
                            );

                            tl.to(
                                inner,
                                {
                                    rotateY: 0,
                                    rotateX: 0,
                                    y: 0,
                                    z: 0,
                                    scale: 1,
                                    duration: 0.56,
                                    ease: 'power4.out'
                                },
                                tAt + 0.32
                            );

                            if (sheens[i]) {
                                tl.fromTo(
                                    sheens[i],
                                    { xPercent: -130, opacity: 0 },
                                    { xPercent: 130, opacity: 0.9, duration: 0.6, ease: 'power2.inOut' },
                                    tAt + 0.26
                                );
                            }

                            if (titles[i]) {
                                tl.to(titles[i], { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, tAt + 0.48);
                            }
                        }
                    });

                    // Stage 6: RESULT — 破曉回暖至溫暖明亮氛圍，呈現牌名與既有解讀內容
                    tl.to({}, { duration: reduced ? 0.05 : 0.22 });
                    tl.call(() => {
                        if (sessionRef.current === mySession) {
                            setStageSceneTone('luminous');
                            setCardPhase('RESULT');
                            if (window.DivinationStage) window.DivinationStage.playChime('sacred');
                        }
                    });

                    if (revealTextRef.current) {
                        const staggerItems = revealTextRef.current.querySelectorAll('.oracle-stagger-item');
                        tl.fromTo(
                            revealTextRef.current,
                            { opacity: 0.1, y: 14, clipPath: 'inset(0% 0% 100% 0%)' },
                            {
                                opacity: 1,
                                y: 0,
                                clipPath: 'inset(0% 0% 0% 0%)',
                                duration: reduced ? 0.28 : 0.76,
                                ease: 'power4.out'
                            }
                        );
                        if (staggerItems.length > 0 && !reduced) {
                            tl.fromTo(
                                staggerItems,
                                { opacity: 0, y: 8, filter: 'blur(4px)' },
                                { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.48, stagger: 0.09, ease: 'power3.out' },
                                '-=0.45'
                            );
                        }
                    }
                } else {
                    setStageSceneTone('luminous');
                    setCardPhase('RESULT');
                }

                return () => {
                    if (tlRef.current) tlRef.current.kill();
                };
            }, [stage]);

            const isSelectingAllowed = cardPhase === 'SELECTING';
            const isSummonLocked = [
                'MAGIC_CIRCLE',
                'ENERGY_GATHERING',
                'CARD_MATERIALIZATION',
                'CARD_AWAKENING',
                'CARD_REVEAL'
            ].includes(cardPhase);
            const isFlowingEdge = cardPhase === 'CARD_AWAKENING' || cardPhase === 'CARD_REVEAL';

            const handleMainClick = (id) => {
                if (stage !== 'main-select' || !isSelectingAllowed) return;
                if (mainOrder.includes(id)) setMainOrder(mainOrder.filter((item) => item !== id));
                else if (mainOrder.length < 3) {
                    setMainOrder([...mainOrder, id]);
                    if (window.DivinationStage) window.DivinationStage.playCardRevealSound();
                }
            };

            const handleSubClick = (id) => {
                if (stage !== 'sub-select' || !isSelectingAllowed) return;
                if (subOrder.includes(id)) setSubOrder(subOrder.filter((item) => item !== id));
                else if (subOrder.length < 3) {
                    setSubOrder([...subOrder, id]);
                    if (window.DivinationStage) window.DivinationStage.playCardRevealSound();
                }
            };

            const getCard = (id, list) => list.find((c) => c.id === id);
            const getResultData = (type) => {
                if (type === 'main' && mainOrder.length === 3) return interpretations.main[mainOrder.join('-')];
                if (type === 'sub' && subOrder.length === 3) return interpretations.sub[subOrder.join('-')];
                return null;
            };

            const activeOrder = stage === 'main-select' ? mainOrder : subOrder;
            const activeCards = stage === 'main-select' ? mainCardsData : subCardsData;

            return (
                <div
                    className="flex-1 flex flex-col items-center w-full max-w-5xl mx-auto px-4 pt-4 pb-8"
                    data-ritual-phase={cardPhase}
                >
                    <div className="text-center mb-3 animate-ink-reveal">
                        <p className="font-latin text-[10px] md:text-xs tracking-[0.36em] text-theme-gold uppercase mb-1.5">
                            {stage.includes('main')
                                ? 'MAGICAL SUMMONING · PHASE I'
                                : stage.includes('sub')
                                ? 'MAGICAL SUMMONING · PHASE II'
                                : 'ORACLE INTEGRATION · PHASE III'}
                        </p>
                        <h2 className="text-base md:text-xl font-light text-theme-primary tracking-[0.16em] max-w-2xl mx-auto leading-relaxed">
                            {stage === 'main-select' && "主牌組：依照你現在生活中的感受，選擇最優先的順序"}
                            {stage === 'main-reveal' && "三元召喚顯現：連結、起源與未來"}
                            {stage === 'sub-select' && "子牌組：依照你現在生活中的感受，選擇最不優先的順序"}
                            {stage === 'final-reveal' && "命運之流召喚：潛意識的低語"}
                            {stage === 'final-overview' && "全覽對照：顯意識與潛意識的交織"}
                        </h2>
                    </div>

                    {/* 選牌階段 */}
                    {(stage === 'main-select' || stage === 'sub-select') && (
                        <div className="flex-1 flex flex-col items-center justify-center w-full">
                            <div
                                ref={selectDeckRef}
                                className="w-full flex md:justify-center overflow-x-auto snap-x snap-mandatory gap-4 md:gap-6 px-[18vw] md:px-4 py-3 no-scrollbar items-center"
                            >
                                {activeCards.map((card, idx) => (
                                    <InteractiveCard
                                        key={card.id}
                                        card={card}
                                        idx={idx}
                                        orderList={activeOrder}
                                        isSelectingAllowed={isSelectingAllowed}
                                        onClick={stage === 'main-select' ? handleMainClick : handleSubClick}
                                    />
                                ))}
                            </div>

                            <div className="flex items-center gap-3 mt-1 mb-4">
                                {[0, 1, 2].map((slot) => {
                                    const filled = Boolean(activeOrder[slot]);
                                    return (
                                        <div
                                            key={slot}
                                            className={`flex items-center gap-2 px-3.5 py-1 rounded-full border text-[11px] font-latin tracking-[0.2em] transition-all duration-500 ${
                                                filled
                                                    ? 'border-[#b89254] bg-[#b89254]/18 text-theme-primary font-medium'
                                                    : 'border-[#b89254]/25 text-theme-muted'
                                            }`}
                                        >
                                            <span>{ROMAN[slot]}</span>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="h-14 flex items-center justify-center">
                                {cardPhase === 'SHUFFLING' ? (
                                    <p className="text-xs tracking-[0.36em] text-theme-gold animate-pulse pl-[0.36em]">
                                        {SUMMON_PHASE_LABELS.SHUFFLING}
                                    </p>
                                ) : activeOrder.length === 3 ? (
                                    <button
                                        onClick={() => setStage(stage === 'main-select' ? 'main-reveal' : 'final-reveal')}
                                        disabled={!isSelectingAllowed}
                                        className="ritual-btn ritual-btn-primary rounded-full py-3.5 text-sm animate-ink-reveal"
                                    >
                                        {stage === 'main-select' ? '啟動三元召喚' : '召喚潛意識全貌'}
                                    </button>
                                ) : (
                                    <p className="text-xs tracking-[0.26em] text-theme-secondary">
                                        請依直覺點選 {3 - activeOrder.length} 張魔卡定錨召喚序位
                                    </p>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 六階段召喚與揭示舞台 */}
                    {(stage === 'main-reveal' || stage === 'final-reveal') && (
                        <div className="flex-1 flex flex-col items-center justify-center w-full">
                            <div
                                ref={revealGridRef}
                                className="grid grid-cols-3 gap-3 sm:gap-5 md:gap-7 w-full max-w-xl mb-4 tarot-stage-perspective"
                            >
                                {(stage === 'main-reveal' ? mainOrder : subOrder).map((id, index) => {
                                    const list = stage === 'main-reveal' ? mainCardsData : subCardsData;
                                    const card = getCard(id, list);
                                    const cTheme = CARD_SUMMON_THEMES[id] || CARD_SUMMON_THEMES.origin;
                                    return (
                                        <div key={id} className="flex flex-col items-center tarot-stage-perspective">
                                            <div
                                                style={{
                                                    '--card-element-color': cTheme.color,
                                                    '--card-element-glow': cTheme.glow
                                                }}
                                                className={`reveal-card-inner card-3d-inner w-full max-w-[144px] ${
                                                    isFlowingEdge ? 'card-awakening-active' : ''
                                                }`}
                                            >
                                                <div className="card-awakening-aura"></div>
                                                <div className="card-3d-thickness"></div>
                                                <div className="card-face card-face-front">
                                                    <img
                                                        src={card.img}
                                                        alt={card.title}
                                                        className="w-full h-full object-cover scale-[1.05]"
                                                    />
                                                    <div className="card-arcane-frame"></div>
                                                    <div className="reveal-sheen card-sheen" />
                                                    <div className="selection-seal !w-7 !h-7 !text-xs !top-2 !right-2">
                                                        {ROMAN[index]}
                                                    </div>
                                                </div>
                                                <div className="card-face card-face-back">
                                                    <CardBackOrnament />
                                                </div>
                                            </div>
                                            <p className="reveal-card-title font-latin text-[10px] md:text-xs tracking-[0.18em] text-theme-secondary mt-2 uppercase opacity-0">
                                                {card.title}
                                            </p>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* 召喚期間階段指示與進度點（翻完前嚴格防劇透） */}
                            {isSummonLocked && (
                                <div className="min-h-[145px] flex flex-col items-center justify-center gap-3">
                                    <p className="text-xs tracking-[0.36em] text-[#f4dfb4] animate-pulse pl-[0.36em]">
                                        {SUMMON_PHASE_LABELS[cardPhase]}
                                    </p>
                                    <div className="flex items-center gap-1.5">
                                        {[
                                            'MAGIC_CIRCLE',
                                            'ENERGY_GATHERING',
                                            'CARD_MATERIALIZATION',
                                            'CARD_AWAKENING',
                                            'CARD_REVEAL'
                                        ].map((st) => (
                                            <span
                                                key={st}
                                                className={`h-1 rounded-full transition-all duration-300 ${
                                                    cardPhase === st ? 'w-5 bg-[#f5e1b8]' : 'w-1.5 bg-[#c8a46b]/35'
                                                }`}
                                            />
                                        ))}
                                    </div>
                                </div>
                            )}

                            {getResultData(stage === 'main-reveal' ? 'main' : 'sub') && (
                                <div
                                    ref={revealTextRef}
                                    className={`sanctuary-glass max-w-2xl w-full text-center px-6 py-4 md:px-8 md:py-5 rounded-2xl mb-4 ${
                                        cardPhase === 'RESULT' ? '' : 'hidden'
                                    }`}
                                >
                                    <h3 className="oracle-stagger-item text-lg md:text-2xl font-latin font-semibold text-theme-gold tracking-[0.22em] mb-0.5">
                                        {getResultData(stage === 'main-reveal' ? 'main' : 'sub').title}
                                    </h3>
                                    <p className="oracle-stagger-item text-xs text-theme-secondary tracking-[0.34em]">
                                        {getResultData(stage === 'main-reveal' ? 'main' : 'sub').zhTitle}
                                    </p>
                                    <div className="oracle-stagger-item gold-hairline w-24 mx-auto my-2.5"></div>
                                    <div className="text-theme-primary text-sm md:text-[15px] leading-relaxed mb-3.5 font-light space-y-1">
                                        {getResultData(stage === 'main-reveal' ? 'main' : 'sub')
                                            .poem.split('\n')
                                            .map((line, lIdx) => (
                                                <p key={lIdx} className="oracle-stagger-item">
                                                    {line}
                                                </p>
                                            ))}
                                    </div>
                                    <div className="oracle-stagger-item bg-[#b89254]/12 border border-[#b89254]/35 rounded-xl px-4 py-2 inline-block">
                                        <p className="text-xs md:text-sm text-theme-primary tracking-[0.12em] leading-relaxed">
                                            <span className="mr-2 text-theme-gold">✦</span>
                                            {getResultData(stage === 'main-reveal' ? 'main' : 'sub').note}
                                        </p>
                                    </div>
                                </div>
                            )}

                            <div className="min-h-[44px] flex items-center justify-center">
                                {cardPhase === 'RESULT' && (
                                    stage === 'main-reveal' ? (
                                        <button
                                            onClick={() => setStage('sub-select')}
                                            className="ritual-btn ritual-btn-primary rounded-full py-3 text-xs uppercase animate-ink-reveal"
                                        >
                                            前往子牌組召喚
                                        </button>
                                    ) : (
                                        <button
                                            onClick={() => setStage('final-overview')}
                                            className="ritual-btn ritual-btn-primary rounded-full py-3 text-xs uppercase animate-ink-reveal"
                                        >
                                            全覽對照
                                        </button>
                                    )
                                )}
                            </div>
                        </div>
                    )}

                    {/* 全覽對照 (final-overview) */}
                    {stage === 'final-overview' && (
                        <div className="flex-1 flex flex-col items-center w-full animate-ink-reveal">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5 w-full max-w-4xl">
                                <div className="sanctuary-glass rounded-2xl p-5 md:p-6 flex flex-col justify-between">
                                    <div>
                                        <div className="flex items-center justify-center gap-2 mb-3">
                                            <span className="cinnabar-stamp">顯意識 · 優先順序</span>
                                        </div>
                                        {getResultData('main') && (
                                            <div className="text-center">
                                                <h4 className="font-latin text-lg md:text-xl text-theme-gold tracking-[0.18em] mb-0.5">
                                                    {getResultData('main').title}
                                                </h4>
                                                <p className="text-xs text-theme-secondary tracking-[0.3em] mb-3">
                                                    {getResultData('main').zhTitle}
                                                </p>
                                                <div className="gold-hairline w-16 mx-auto mb-3"></div>
                                                <p className="text-theme-primary text-sm leading-loose whitespace-pre-line mb-4 font-light">
                                                    {getResultData('main').poem}
                                                </p>
                                                <p className="text-xs text-theme-primary tracking-wider bg-[#b89254]/10 border border-[#b89254]/25 p-3 rounded-xl leading-relaxed">
                                                    {getResultData('main').note}
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                    <div className="flex justify-center gap-3 mt-5">
                                        {mainOrder.map((id, idx) => (
                                            <div key={id} className="w-12 h-18 rounded-md overflow-hidden border border-[#b89254]/45 relative shadow-md">
                                                <img src={getCard(id, mainCardsData).img} alt="" className="w-full h-full object-cover" />
                                                <div className="absolute top-0 right-0 bg-[#9e4238] text-white font-latin text-[9px] w-4 h-4 flex items-center justify-center">
                                                    {ROMAN[idx]}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="sanctuary-glass rounded-2xl p-5 md:p-6 flex flex-col justify-between">
                                    <div>
                                        <div className="flex items-center justify-center gap-2 mb-3">
                                            <span className="cinnabar-stamp !border-[#7b93b2]/55 !text-[#4c6586] !bg-[#7b93b2]/12">
                                                潛意識 · 非優先順序
                                            </span>
                                        </div>
                                        {getResultData('sub') && (
                                            <div className="text-center">
                                                <h4 className="font-latin text-lg md:text-xl text-theme-gold tracking-[0.18em] mb-0.5">
                                                    {getResultData('sub').title}
                                                </h4>
                                                <p className="text-xs text-theme-secondary tracking-[0.3em] mb-3">
                                                    {getResultData('sub').zhTitle}
                                                </p>
                                                <div className="gold-hairline w-16 mx-auto mb-3"></div>
                                                <p className="text-theme-primary text-sm leading-loose whitespace-pre-line mb-4 font-light">
                                                    {getResultData('sub').poem}
                                                </p>
                                                <p className="text-xs text-theme-primary tracking-wider bg-[#b89254]/10 border border-[#b89254]/25 p-3 rounded-xl leading-relaxed">
                                                    {getResultData('sub').note}
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                    <div className="flex justify-center gap-3 mt-5">
                                        {subOrder.map((id, idx) => (
                                            <div key={id} className="w-12 h-18 rounded-md overflow-hidden border border-[#7b93b2]/45 relative shadow-md">
                                                <img src={getCard(id, subCardsData).img} alt="" className="w-full h-full object-cover" />
                                                <div className="absolute top-0 right-0 bg-[#3a4860] text-white font-latin text-[9px] w-4 h-4 flex items-center justify-center">
                                                    {ROMAN[idx]}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="mt-7">
                                <button
                                    onClick={() => {
                                        setStage('main-select');
                                        setMainOrder([]);
                                        setSubOrder([]);
                                    }}
                                    className="ritual-btn rounded-full py-2.5 text-xs"
                                >
                                    重新開啟牌陣
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // =====================================================================
        // 3. 靈籤 · 宇宙指引元件 (RandomGuide) — Celestial Mechanism 六階段天體封印機關
        //    流程：DORMANT → AWAKENING → ACTIVATION → UNLOCKING → REVELATION → GUIDANCE
        //    嚴格保留既有 15 則指引資料與均勻隨機抽取邏輯
        // =====================================================================
        const CELESTIAL_PHASE_LABELS = {
            DORMANT: '古老天體封印靜候中，輕觸喚醒十二星宿符文',
            AWAKENING: '十二星宿符文逐一甦醒點亮⋯',
            ACTIVATION: '多層周天齒輪與星軌反向運轉共鳴⋯',
            UNLOCKING: '星環咬合對齊，中央六瓣玉鎖退栓開啟⋯',
            REVELATION: '封印核心能量綻放，天光破曉⋯',
            GUIDANCE: '天機已現，細品古卷中的溫柔指引'
        };

        const RandomGuide = ({ selectedIntent }) => {
            const [phase, setPhase] = useState("DORMANT");
            const [currentGuide, setCurrentGuide] = useState({ main: "", sub: "" });
            const [oracleNo, setOracleNo] = useState(1);
            const [fallbackMode, setFallbackMode] = useState(false);

            const scrollPaperRef = useRef(null);
            const stampRef = useRef(null);
            const mainTextRef = useRef(null);
            const subTextRef = useRef(null);
            const tlRef = useRef(null);
            const sessionRef = useRef(0);
            const fallbackTimerRef = useRef(null);

            const isBusy = phase !== "DORMANT" && phase !== "GUIDANCE";
            const showScroll = phase === "GUIDANCE";

            // 既有 15 則指引資料（100% 嚴格保留，隻字不改）
            const guides = [
                { main: "「行到水窮處，坐看雲起時」", sub: "— 王維。適合靜觀其變，答案就在轉彎處。" },
                { main: "「萬物皆有裂痕，那是光照進來的地方」", sub: "— 萊昂納德·科恩。擁抱不完美，那是突破點。" },
                { main: "「月が綺麗ですね」", sub: "（月色真美）— 夏目漱石。珍惜眼前的含蓄與美好，不必急著說破。" },
                { main: "「Stay hungry, stay foolish.」", sub: "（求知若渴，虛懷若谷）— 保持初衷，大膽去闖。" },
                { main: "「回首向來蕭瑟處，也無風雨也無晴」", sub: "— 蘇軾。看淡得失，平靜是最大的力量。" },
                { main: "「The woods are lovely, dark and deep.」", sub: "（森林可愛、幽暗而深邃）— 前方迷人但充滿挑戰，記得你的承諾。" },
                { main: "「既然選擇了遠方，便只顧風雨兼程」", sub: "— 汪國真。目標已定，就不要再回頭猶豫。" },
                { main: "「凡是過往，皆為序章」", sub: "— 莎士比亞。放下過去的包袱，新的篇章正在開始。" },
                { main: "「知其不可而為之」", sub: "— 典出《論語》。有時明知艱難仍要去試，便是你的道。" },
                { main: "「潘朵拉的盒子已打開，但希望仍留其中」", sub: "— 希臘神話。混難中必存生機。" },
                { main: "「衝了，不要猶豫」", sub: "當下的直覺就是最準確的導航。" },
                { main: "「現在不是時候」", sub: "退後一步，讓子彈飛一會兒。" },
                { main: "「問問身邊長輩或智者的意見」", sub: "經驗的火炬能幫你照亮盲點。" },
                { main: "「先去睡一覺，醒來再決定」", sub: "潛意識會在夢中為你整理混亂。" },
                { main: "「放棄也是一種勇氣的表現」", sub: "止損是為了把能量留給更好的事。" }
            ];

            useEffect(() => {
                setStageSceneTone('ethereal');
                if (window.DivinationStage && !window.DivinationStage.isWebGLAvailable()) {
                    setFallbackMode(true);
                }
                return () => {
                    sessionRef.current++;
                    if (fallbackTimerRef.current) clearTimeout(fallbackTimerRef.current);
                    if (tlRef.current) tlRef.current.kill();
                    if (window.DivinationStage && typeof window.DivinationStage.resetCosmicOracle === 'function') {
                        window.DivinationStage.resetCosmicOracle();
                    }
                };
            }, []);

            // GUIDANCE 階段：溫暖晨曦中展開古紙卷軸，依序顯影籤序、主句與釋義
            useEffect(() => {
                if (phase !== "GUIDANCE") return;
                if (tlRef.current) tlRef.current.kill();

                const reduced =
                    window.DivinationStage && typeof window.DivinationStage.getReducedMotion === 'function'
                        ? window.DivinationStage.getReducedMotion()
                        : false;

                if (window.gsap && scrollPaperRef.current) {
                    const tl = window.gsap.timeline();
                    tlRef.current = tl;

                    tl.fromTo(
                        scrollPaperRef.current,
                        { width: 0, opacity: 0.2 },
                        {
                            width: '100%',
                            opacity: 1,
                            duration: reduced ? 0.3 : 0.9,
                            ease: 'expo.inOut',
                            onStart: () => window.DivinationStage && window.DivinationStage.playCardRevealSound()
                        }
                    );

                    if (stampRef.current) {
                        tl.fromTo(
                            stampRef.current,
                            { opacity: 0, scale: 0.86, y: 8 },
                            { opacity: 1, scale: 1, y: 0, duration: reduced ? 0.18 : 0.45, ease: 'power3.out' },
                            '-=0.18'
                        );
                    }
                    if (mainTextRef.current) {
                        tl.fromTo(
                            mainTextRef.current,
                            { opacity: 0, y: 12, filter: 'blur(4px)' },
                            { opacity: 1, y: 0, filter: 'blur(0px)', duration: reduced ? 0.2 : 0.6, ease: 'power4.out' },
                            '-=0.06'
                        );
                    }
                    if (subTextRef.current) {
                        tl.fromTo(
                            subTextRef.current,
                            { opacity: 0, y: 10, filter: 'blur(3px)' },
                            { opacity: 1, y: 0, filter: 'blur(0px)', duration: reduced ? 0.2 : 0.55, ease: 'power3.out' },
                            '-=0.08'
                        );
                    }
                }

                return () => {
                    if (tlRef.current) tlRef.current.kill();
                };
            }, [phase]);

            const getGuide = () => {
                if (isBusy) return;

                const mySession = ++sessionRef.current;
                setPhase("AWAKENING");
                // 啟動機關：柔和轉入深邃星夜，凸顯 12 符文點亮與六瓣鎖開啟光效
                setStageSceneTone('dusk');

                // 既有均勻隨機抽取邏輯（100% 嚴格保留）
                const idx = Math.floor(Math.random() * guides.length);
                const chosen = guides[idx];
                const num = idx + 1;

                const onRevealed = () => {
                    if (sessionRef.current !== mySession) return;
                    setOracleNo(num);
                    setCurrentGuide(chosen);
                    setStageSceneTone('luminous');
                    setPhase("GUIDANCE");
                };

                const onPhaseChange = (nextPhase) => {
                    if (sessionRef.current !== mySession) return;
                    if (nextPhase === "REVELATION") {
                        // 封印核心綻放時，空間同步破曉回暖
                        setStageSceneTone('luminous');
                    }
                    if (nextPhase !== "GUIDANCE") {
                        setPhase(nextPhase);
                    }
                };

                const started3D =
                    window.DivinationStage &&
                    typeof window.DivinationStage.invokeCosmicOracle === 'function' &&
                    window.DivinationStage.invokeCosmicOracle(num, onRevealed, onPhaseChange);

                if (!started3D) {
                    setFallbackMode(true);
                    fallbackTimerRef.current = setTimeout(() => {
                        if (sessionRef.current !== mySession) return;
                        setPhase("ACTIVATION");
                        fallbackTimerRef.current = setTimeout(onRevealed, 950);
                    }, 450);
                }
            };

            const resetRitual = () => {
                sessionRef.current++;
                if (fallbackTimerRef.current) clearTimeout(fallbackTimerRef.current);
                if (tlRef.current) tlRef.current.kill();
                setPhase("DORMANT");
                setStageSceneTone('ethereal');
                if (window.DivinationStage && typeof window.DivinationStage.resetCosmicOracle === 'function') {
                    window.DivinationStage.resetCosmicOracle();
                }
            };

            const formattedOracleLabel =
                window.DivinationStage && typeof window.DivinationStage.formatOracleIndex === 'function'
                    ? window.DivinationStage.formatOracleIndex(oracleNo)
                    : `天 機 · 第 ${oracleNo} 籤`;

            return (
                <div
                    className="flex-1 flex flex-col items-center justify-between w-full max-w-3xl mx-auto px-4 pt-5 pb-8 min-h-[calc(100dvh-136px)]"
                    data-ritual-phase={phase}
                >
                    <div className="text-center animate-ink-reveal">
                        <p className="font-latin text-[10px] md:text-xs tracking-[0.38em] text-theme-gold uppercase mb-1.5">
                            CELESTIAL MECHANISM · 宇 宙 封 印 靈 籤
                        </p>
                        <p className="text-sm md:text-base text-theme-primary tracking-[0.18em] font-light">
                            {CELESTIAL_PHASE_LABELS[phase]}
                        </p>
                    </div>

                    <div className="flex-1 flex items-center justify-center w-full my-5">
                        {showScroll ? (
                            <div className="scroll-container">
                                <div className="scroll-rod" aria-hidden="true" />
                                <div ref={scrollPaperRef} className="scroll-paper-wrapper">
                                    <div className="scroll-paper text-center flex flex-col items-center justify-center">
                                        <div className="w-full">
                                            <div ref={stampRef} className="mb-3.5 opacity-0">
                                                <span className="cinnabar-stamp">{formattedOracleLabel}</span>
                                            </div>
                                            <p
                                                ref={mainTextRef}
                                                className="text-xl md:text-2xl font-normal text-theme-primary leading-relaxed tracking-[0.12em] mb-3.5 opacity-0"
                                            >
                                                {currentGuide.main}
                                            </p>
                                            <div className="gold-hairline w-24 mx-auto my-3.5"></div>
                                            <p
                                                ref={subTextRef}
                                                className="text-xs md:text-sm text-theme-secondary leading-relaxed tracking-[0.14em] font-normal max-w-lg mx-auto opacity-0"
                                            >
                                                {currentGuide.sub}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                                <div className="scroll-rod" aria-hidden="true" />
                            </div>
                        ) : (
                            <div className="min-h-[240px] md:min-h-[300px] w-full flex items-center justify-center pointer-events-none">
                                {fallbackMode && (
                                    <div className={`w-36 h-36 rounded-full border border-[#b89254]/55 bg-white/25 backdrop-blur-md flex items-center justify-center text-theme-primary tracking-[0.24em] text-xs ${isBusy ? 'animate-spin' : ''}`}>
                                        天體封印
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    <div className="flex flex-col items-center gap-3.5">
                        {isBusy && (
                            <div className="flex items-center gap-1.5">
                                {['AWAKENING', 'ACTIVATION', 'UNLOCKING', 'REVELATION'].map((step) => (
                                    <span
                                        key={step}
                                        className={`h-1 rounded-full transition-all duration-300 ${
                                            phase === step ? 'w-6 bg-[#f5e1b8]' : 'w-1.5 bg-[#c8a46b]/35'
                                        }`}
                                    />
                                ))}
                            </div>
                        )}

                        {phase === "GUIDANCE" ? (
                            <button
                                onClick={resetRitual}
                                className="ritual-btn rounded-full py-3.5 text-sm animate-ink-reveal"
                            >
                                再 啟 天 機
                            </button>
                        ) : (
                            <button
                                onClick={getGuide}
                                disabled={isBusy}
                                className="ritual-btn ritual-btn-primary rounded-full py-3.5 text-sm"
                            >
                                {isBusy ? '封 印 解 鎖 中' : '啟 動 天 體 機 關'}
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // =====================================================================
        // 主程式 App — 五幕式旅程與雙場景同步控制器
        // view: 'threshold' → 'intent' → 'portals' → ('blocks' | 'cards' | 'guide')
        // =====================================================================
        const VALID_VIEWS = ['threshold', 'intent', 'portals', 'blocks', 'cards', 'guide'];

        const App = () => {
            const getInitialView = () => {
                const h = window.location.hash.replace('#', '');
                return VALID_VIEWS.includes(h) ? h : 'threshold';
            };

            const [view, setView] = useState(getInitialView);
            const [selectedIntent, setSelectedIntent] = useState(null);
            const [soundOn, setSoundOn] = useState(false);
            const [reducedMotion, setReducedMotion] = useState(
                () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
            );

            // 支援瀏覽器返回上一頁 / Hash 導覽
            useEffect(() => {
                const onHashOrPop = () => {
                    setView(getInitialView());
                };
                window.addEventListener('hashchange', onHashOrPop);
                window.addEventListener('popstate', onHashOrPop);
                return () => {
                    window.removeEventListener('hashchange', onHashOrPop);
                    window.removeEventListener('popstate', onHashOrPop);
                };
            }, []);

            const navigateTo = (nextView) => {
                if (nextView === view) return;
                const targetHash = nextView === 'threshold' ? '' : `#${nextView}`;
                if (window.location.hash !== targetHash) {
                    window.history.pushState({ view: nextView }, '', targetHash || window.location.pathname + window.location.search);
                }
                setView(nextView);
            };

            // 同步目前畫面至 3D WebGL 舞台模式
            useEffect(() => {
                const syncStage = () => {
                    if (!window.DivinationStage) return;
                    const stageMode = ['blocks', 'cards', 'guide'].includes(view) ? view : 'sanctuary';
                    window.DivinationStage.setMode(stageMode);

                    if (view === 'threshold' || view === 'intent') {
                        window.DivinationStage.setSceneTone('luminous');
                    } else if (view === 'portals') {
                        window.DivinationStage.setSceneTone('ethereal');
                    }
                };
                syncStage();
                window.addEventListener('divination-stage-ready', syncStage);
                return () => window.removeEventListener('divination-stage-ready', syncStage);
            }, [view]);

            const handleToggleSound = () => {
                if (window.DivinationStage && typeof window.DivinationStage.toggleSound === 'function') {
                    const next = window.DivinationStage.toggleSound();
                    setSoundOn(next);
                }
            };

            const handleToggleMotion = () => {
                const next = !reducedMotion;
                setReducedMotion(next);
                if (window.DivinationStage && typeof window.DivinationStage.setReducedMotion === 'function') {
                    window.DivinationStage.setReducedMotion(next);
                }
            };

            const isRitualView = ['blocks', 'cards', 'guide'].includes(view);

            return (
                <div className="min-h-[100dvh] w-full flex flex-col relative">
                    {/* Act I 入口畫面隱藏三種功能頁籤，僅保留右上角極簡靜音／動效微控制 */}
                    {view === 'threshold' ? (
                        <div className="w-full max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-end gap-2">
                            <button
                                onClick={handleToggleSound}
                                title={soundOn ? '關閉儀式音效' : '開啟儀式音效'}
                                className="p-2 rounded-full border border-[#b89254]/30 bg-white/40 backdrop-blur-sm text-theme-secondary hover:text-theme-primary transition-colors"
                            >
                                {soundOn ? <Icons.VolumeOn /> : <Icons.VolumeOff />}
                            </button>
                            <button
                                onClick={handleToggleMotion}
                                className="px-2.5 py-1 rounded-full border border-[#b89254]/30 bg-white/40 backdrop-blur-sm text-[10px] tracking-[0.16em] text-theme-secondary hover:text-theme-primary transition-colors"
                            >
                                {reducedMotion ? '靜謐' : '動效'}
                            </button>
                        </div>
                    ) : (
                        /* Act II 以後浮現溫潤琉璃導覽列（支援返回問心／三境入口與切換儀式） */
                        <header className="w-full sticky top-0 z-30 sanctuary-header">
                            <div className="max-w-5xl mx-auto px-3 sm:px-6 h-15 py-2.5 flex items-center justify-between gap-2">
                                {/* 品牌印記（點擊返回三境入口或首屏） */}
                                <button
                                    onClick={() => navigateTo(view === 'portals' ? 'threshold' : 'portals')}
                                    className="flex items-center gap-2 sm:gap-2.5 shrink-0 text-left outline-none group"
                                    title="返回神祕入口選擇"
                                >
                                    <div className="w-7 h-7 rounded-full border border-[#b89254]/55 flex items-center justify-center text-[11px] text-theme-gold font-serif-tc shrink-0 group-hover:scale-105 transition-transform">
                                        問
                                    </div>
                                    <div className="leading-tight whitespace-nowrap">
                                        <span className="block text-xs sm:text-sm font-medium tracking-[0.16em] sm:tracking-[0.24em] text-theme-primary">
                                            靈感問路站
                                        </span>
                                        <span className="font-latin text-[8px] tracking-[0.2em] text-theme-muted uppercase hidden sm:block">
                                            Luminous Sanctuary
                                        </span>
                                    </div>
                                </button>

                                {/* 進入儀式後顯示切換導覽；在問心／擇門階段則顯示溫柔進度提示 */}
                                {isRitualView ? (
                                    <nav className="flex items-center h-9 gap-0.5 sm:gap-4 shrink-0">
                                        <button
                                            onClick={() => navigateTo('portals')}
                                            className="nav-tab h-full px-1.5 sm:px-2.5 flex items-center gap-1 text-[11px] sm:text-xs tracking-[0.1em] whitespace-nowrap"
                                        >
                                            <span className="hidden md:inline-flex"><Icons.Sparkle /></span>
                                            <span>三境</span>
                                        </button>
                                        <button
                                            onClick={() => navigateTo('blocks')}
                                            className={`nav-tab h-full px-2 sm:px-3 flex items-center gap-1 text-[11px] sm:text-xs tracking-[0.12em] sm:tracking-[0.2em] whitespace-nowrap ${view === 'blocks' ? 'active' : ''}`}
                                        >
                                            <span className="hidden sm:inline-flex"><Icons.Moon /></span>
                                            <span>擲筊</span>
                                        </button>
                                        <button
                                            onClick={() => navigateTo('cards')}
                                            className={`nav-tab h-full px-2 sm:px-3 flex items-center gap-1 text-[11px] sm:text-xs tracking-[0.12em] sm:tracking-[0.2em] whitespace-nowrap ${view === 'cards' ? 'active' : ''}`}
                                        >
                                            <span className="hidden sm:inline-flex"><Icons.Cards /></span>
                                            <span>三元牌</span>
                                        </button>
                                        <button
                                            onClick={() => navigateTo('guide')}
                                            className={`nav-tab h-full px-1.5 sm:px-3 flex items-center gap-1 text-[11px] sm:text-xs tracking-[0.08em] sm:tracking-[0.2em] whitespace-nowrap ${view === 'guide' ? 'active' : ''}`}
                                        >
                                            <span className="hidden sm:inline-flex"><Icons.Compass /></span>
                                            <span>靈籤</span>
                                        </button>
                                    </nav>
                                ) : (
                                    <div className="flex items-center gap-2 text-[11px] tracking-[0.2em] text-theme-secondary">
                                        <span className={view === 'intent' ? 'text-theme-gold font-medium' : ''}>問心</span>
                                        <span className="opacity-40">·</span>
                                        <span className={view === 'portals' ? 'text-theme-gold font-medium' : ''}>擇門</span>
                                    </div>
                                )}

                                {/* 右側心念印記＋音效與動效微控制 */}
                                <div className="flex items-center gap-1.5 shrink-0">
                                    {selectedIntent && isRitualView && (
                                        <button
                                            onClick={() => navigateTo('intent')}
                                            title="更換所問心念"
                                            className="hidden lg:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border border-[#b89254]/30 text-[10px] tracking-[0.14em] text-theme-secondary hover:text-theme-primary transition-colors"
                                        >
                                            <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: selectedIntent.color }} />
                                            <span>{selectedIntent.label}</span>
                                        </button>
                                    )}
                                    <button
                                        onClick={handleToggleSound}
                                        title={soundOn ? '關閉儀式音效' : '開啟儀式音效'}
                                        className={`p-2 rounded-full border transition-colors ${
                                            soundOn
                                                ? 'border-[#b89254]/65 text-theme-gold bg-[#b89254]/14'
                                                : 'border-[#b89254]/22 text-theme-secondary hover:text-theme-primary'
                                        }`}
                                    >
                                        {soundOn ? <Icons.VolumeOn /> : <Icons.VolumeOff />}
                                    </button>
                                    <button
                                        onClick={handleToggleMotion}
                                        title={reducedMotion ? '切換標準動態' : '切換靜謐簡約動態'}
                                        className={`hidden sm:inline-flex px-2.5 py-1 rounded-full border text-[10px] tracking-[0.16em] transition-colors ${
                                            reducedMotion
                                                ? 'border-[#b89254]/65 text-theme-gold bg-[#b89254]/14'
                                                : 'border-[#b89254]/22 text-theme-secondary hover:text-theme-primary'
                                        }`}
                                    >
                                        {reducedMotion ? '靜謐' : '動效'}
                                    </button>
                                </div>
                            </div>
                        </header>
                    )}

                    {/* 主儀式舞台 */}
                    <main className="flex-1 flex flex-col w-full">
                        {view === 'threshold' && (
                            <SanctuaryThreshold onStart={() => navigateTo('intent')} />
                        )}
                        {view === 'intent' && (
                            <IntentSelector
                                selectedIntent={selectedIntent}
                                onSelectIntent={(item) => {
                                    setSelectedIntent(item);
                                    navigateTo('portals');
                                }}
                            />
                        )}
                        {view === 'portals' && (
                            <PortalGateway
                                selectedIntent={selectedIntent}
                                onChangeIntent={() => navigateTo('intent')}
                                onSelectPortal={(portalId) => {
                                    if (window.DivinationStage) window.DivinationStage.playChime('chime');
                                    navigateTo(portalId);
                                }}
                            />
                        )}
                        {view === 'blocks' && <MoonBlocks selectedIntent={selectedIntent} />}
                        {view === 'cards' && <TriadCards />}
                        {view === 'guide' && <RandomGuide selectedIntent={selectedIntent} />}
                    </main>

                    {/* 底部低調安定落款 */}
                    <footer className="w-full text-center py-3.5 text-[11px] tracking-[0.32em] text-theme-muted">
                        <p>心誠則靈 · 願光與平靜陪你同行</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
