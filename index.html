<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>靈感問路站 | Digital Divination Experience</title>

    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- GSAP 3 (Cinematic Timeline Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- Three.js ES Module Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <!-- Luminous Mysticism Design System -->
    <link rel="stylesheet" href="./styles/divination.css">
</head>
<body data-scene-tone="luminous">
    <!-- 全站單一共享 WebGL 沉浸舞台 -->
    <canvas id="webgl-stage" aria-hidden="true"></canvas>
    <div class="grain-overlay" aria-hidden="true"></div>
    <div class="vignette-overlay" aria-hidden="true"></div>

    <!-- React 五幕式儀式互動層 -->
    <div id="root"></div>

    <!-- 3D 雙場景舞台、物理與精密天體機關模組 -->
    <script type="module" src="./js/stage-manager.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icons = {
            Moon: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                </svg>
            ),
            Cards: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
                    <rect width="15" height="20" x="4.5" y="2" rx="2"/>
                    <path d="M9 7h6"/><path d="M9 12h6"/><path d="M12 16.5v.01"/>
                </svg>
            ),
            Compass: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="9.5"/>
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
                </svg>
            ),
            Sparkle: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 3v3m0 12v3M3 12h3m12 0h3m-2.6-6.4-2.1 2.1M8.7 15.3l-2.1 2.1m0-11.8 2.1 2.1m6.6 6.6 2.1 2.1"/>
                </svg>
            ),
            VolumeOn: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                </svg>
            ),
            VolumeOff: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <line x1="22" y1="9" x2="16" y2="15"/>
                    <line x1="16" y1="9" x2="22" y2="15"/>
                </svg>
            )
        };

        const ROMAN = ['I', 'II', 'III'];

        // 六大問卜心念分類（純體驗引導與柔和氛圍連動，絕不干預隨機演算）
        const INTENT_CATEGORIES = [
            {
                id: 'relationship',
                label: '感情與關係',
                sub: '緣分深淺 · 心意相通與進退',
                color: '#cfc4e6',
                glow: 'rgba(207, 196, 230, 0.42)'
            },
            {
                id: 'career',
                label: '事業與工作',
                sub: '職涯轉折 · 抉擇與前行步調',
                color: '#88a4c6',
                glow: 'rgba(136, 164, 198, 0.38)'
            },
            {
                id: 'wealth',
                label: '財運與機會',
                sub: '機遇時節 · 耕耘與收穫契機',
                color: '#98bcb0',
                glow: 'rgba(152, 188, 176, 0.38)'
            },
            {
                id: 'direction',
                label: '人生方向',
                sub: '迷霧尋路 · 傾聽內在真實召喚',
                color: '#dfc08a',
                glow: 'rgba(223, 192, 138, 0.42)'
            },
            {
                id: 'doubt',
                label: '心中的疑惑',
                sub: '思緒千結 · 為懸而未決之事尋光',
                color: '#b4bed0',
                glow: 'rgba(180, 190, 208, 0.38)'
            },
            {
                id: 'unspoken',
                label: '其他未能言明的事',
                sub: '無須說破 · 讓宇宙靜靜回應心念',
                color: '#e5ccb0',
                glow: 'rgba(229, 204, 176, 0.40)'
            }
        ];

        const setStageSceneTone = (tone) => {
            document.body.dataset.sceneTone = tone;
            if (window.DivinationStage && typeof window.DivinationStage.setSceneTone === 'function') {
                window.DivinationStage.setSceneTone(tone);
            }
        };

        // =====================================================================
        // Act I：溫暖靜心入口 (SanctuaryThreshold)
        // 「你來找什麼？」— 溫暖、明亮、安心的進站過渡
        // =====================================================================
        const SanctuaryThreshold = ({ onStart }) => {
            const wrapRef = useRef(null);

            useEffect(() => {
                setStageSceneTone('luminous');
                if (!window.gsap || !wrapRef.current) return;
                const items = wrapRef.current.querySelectorAll('.threshold-item');
                const tl = window.gsap.timeline();
                tl.fromTo(
                    items,
                    { opacity: 0, y: 18, filter: 'blur(6px)' },
                    {
                        opacity: 1,
                        y: 0,
                        filter: 'blur(0px)',
                        duration: 1.15,
                        stagger: 0.24,
                        ease: 'power3.out'
                    }
                );
                return () => tl.kill();
            }, []);

            return (
                <section
                    ref={wrapRef}
                    className="flex-1 flex flex-col items-center justify-center text-center px-6 py-12 max-w-2xl mx-auto min-h-[calc(100dvh-88px)]"
                >
                    {/* 頂部星芒晨曦徽記 */}
                    <div className="threshold-item mb-8">
                        <div className="w-16 h-16 mx-auto rounded-full border border-[#b89254]/45 bg-white/45 backdrop-blur-md flex items-center justify-center shadow-[0_12px_36px_rgba(184,146,84,0.18)]">
                            <svg width="30" height="30" viewBox="0 0 40 40" fill="none">
                                <circle cx="20" cy="20" r="15" stroke="#b89254" strokeWidth="0.9" strokeDasharray="2 3" />
                                <path d="M20 4 L22.6 17.4 L36 20 L22.6 22.6 L20 36 L17.4 22.6 L4 20 L17.4 17.4 Z" stroke="#9e783b" strokeWidth="1.1" fill="rgba(223,193,141,0.28)" />
                                <circle cx="20" cy="20" r="2.6" fill="#9e783b" />
                            </svg>
                        </div>
                    </div>

                    <p className="threshold-item font-latin text-[11px] tracking-[0.42em] text-theme-gold uppercase mb-4">
                        LUMINOUS SANCTUARY · DIGITAL DIVINATION
                    </p>

                    <h1 className="threshold-item text-3xl sm:text-4xl md:text-5xl font-light tracking-[0.22em] pl-[0.22em] text-theme-primary mb-6 leading-snug">
                        你來找什麼？
                    </h1>

                    <div className="threshold-item gold-hairline w-24 mx-auto mb-6"></div>

                    <p className="threshold-item text-sm sm:text-base md:text-lg text-theme-secondary font-light tracking-[0.14em] leading-loose max-w-lg mb-11">
                        有些問題，暫時還找不到答案。<br className="hidden sm:inline" />
                        讓我們陪你尋一條路。
                    </p>

                    <div className="threshold-item">
                        <button
                            onClick={() => {
                                if (window.DivinationStage) window.DivinationStage.playChime('chime');
                                onStart();
                            }}
                            className="ritual-btn ritual-btn-primary rounded-full py-4 text-sm font-normal outline-none"
                        >
                            開 始 尋 找
                        </button>
                    </div>
                </section>
            );
        };

        // =====================================================================
        // Act II：六大心念選擇 (IntentSelector)
        // 純使用者體驗引導，不改變任何隨機演算與結果邏輯
        // =====================================================================
        const IntentSelector = ({ selectedIntent, onSelectIntent }) => {
            const gridRef = useRef(null);

            useEffect(() => {
                setStageSceneTone('luminous');
                if (!window.gsap || !gridRef.current) return;
                const cards = gridRef.current.querySelectorAll('.intent-plaque');
                const tl = window.gsap.fromTo(
                    cards,
                    { opacity: 0, y: 20, scale: 0.96 },
                    { opacity: 1, y: 0, scale: 1, duration: 0.72, stagger: 0.08, ease: 'power3.out' }
                );
                return () => tl.kill();
            }, []);

            return (
                <section className="flex-1 flex flex-col items-center justify-center w-full max-w-4xl mx-auto px-5 py-8">
                    <div className="text-center mb-8 animate-ink-reveal">
                        <p className="font-latin text-[10px] sm:text-xs tracking-[0.38em] text-theme-gold uppercase mb-2.5">
                            ANCHOR YOUR INTENTION
                        </p>
                        <h2 className="text-2xl sm:text-3xl font-light tracking-[0.2em] pl-[0.2em] text-theme-primary mb-2.5">
                            此刻，你想問的是哪一件事？
                        </h2>
                        <p className="text-xs sm:text-sm text-theme-secondary tracking-[0.14em] font-light">
                            在心中輕輕浮現那個人或那件事，選擇最貼近當下心境的方向
                        </p>
                    </div>

                    <div
                        ref={gridRef}
                        className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 w-full max-w-3xl"
                    >
                        {INTENT_CATEGORIES.map((item, index) => {
                            const isActive = selectedIntent && selectedIntent.id === item.id;
                            return (
                                <button
                                    key={item.id}
                                    onClick={() => {
                                        if (window.DivinationStage) {
                                            window.DivinationStage.setIntentAccent(item.color);
                                            window.DivinationStage.playRuneSound(index * 2);
                                        }
                                        onSelectIntent(item);
                                    }}
                                    style={{ '--intent-glow': item.glow }}
                                    className={`intent-plaque rounded-2xl px-6 py-5 text-left flex flex-col justify-between outline-none ${
                                        isActive ? 'ring-1 ring-[#b89254]' : ''
                                    }`}
                                >
                                    <div className="flex items-center justify-between mb-3">
                                        <span
                                            className="w-2.5 h-2.5 rounded-full"
                                            style={{ backgroundColor: item.color, boxShadow: `0 0 10px ${item.glow}` }}
                                        />
                                        <span className="font-latin text-[10px] tracking-[0.25em] text-theme-muted">
                                            0{index + 1}
                                        </span>
                                    </div>
                                    <div>
                                        <h3 className="text-base sm:text-lg font-normal tracking-[0.18em] text-theme-primary mb-1.5">
                                            {item.label}
                                        </h3>
                                        <p className="text-xs text-theme-secondary tracking-[0.1em] font-light">
                                            {item.sub}
                                        </p>
                                    </div>
                                </button>
                            );
                        })}
                    </div>
                </section>
            );
        };

        // =====================================================================
        // Act III：三座神祕儀式入口 (PortalGateway)
        // A. 擲筊 (Divine Response) · B. 三元牌 (Magical Oracle) · C. 靈籤/宇宙指引 (Ancient Revelation)
        // =====================================================================
        const PortalGateway = ({ selectedIntent, onChangeIntent, onSelectPortal }) => {
            const rowRef = useRef(null);

            useEffect(() => {
                setStageSceneTone('ethereal');
                if (!window.gsap || !rowRef.current) return;
                const shrines = rowRef.current.querySelectorAll('.portal-shrine');
                const tl = window.gsap.fromTo(
                    shrines,
                    { opacity: 0, y: 28, scale: 0.96 },
                    { opacity: 1, y: 0, scale: 1, duration: 0.85, stagger: 0.12, ease: 'power3.out' }
                );
                return () => tl.kill();
            }, []);

            return (
                <section className="flex-1 flex flex-col items-center justify-center w-full max-w-5xl mx-auto px-4 sm:px-6 py-6">
                    {/* 心念膠囊與標題 */}
                    <div className="text-center mb-6 sm:mb-8 animate-ink-reveal">
                        {selectedIntent && (
                            <button
                                onClick={onChangeIntent}
                                className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/55 border border-[#b89254]/35 text-xs tracking-[0.18em] text-theme-secondary hover:text-theme-primary transition-colors mb-3 shadow-sm"
                            >
                                <span
                                    className="w-2 h-2 rounded-full"
                                    style={{ backgroundColor: selectedIntent.color }}
                                />
                                <span>所問心念：{selectedIntent.label}</span>
                                <span className="text-[10px] text-theme-gold ml-1">更換</span>
                            </button>
                        )}
                        <h2 className="text-2xl sm:text-3xl font-light tracking-[0.22em] pl-[0.22em] text-theme-primary mb-2">
                            選擇你的指引儀式
                        </h2>
                        <p className="text-xs sm:text-sm text-theme-secondary tracking-[0.15em] font-light">
                            三座神祕入口各自承載不同的回應方式，請依直覺輕觸喚醒
                        </p>
                    </div>

                    {/* 三座神龕入口 */}
                    <div
                        ref={rowRef}
                        className="grid grid-cols-1 md:grid-cols-3 gap-5 sm:gap-6 w-full max-w-4xl"
                    >
                        {/* Portal A：擲筊 · Divine Response */}
                        <div
                            role="button"
                            tabIndex={0}
                            onClick={() => onSelectPortal('blocks')}
                            onKeyDown={(e) => e.key === 'Enter' && onSelectPortal('blocks')}
                            style={{ '--portal-aura': 'rgba(204, 152, 92, 0.34)' }}
                            className="portal-shrine px-6 pt-9 pb-7 flex flex-col items-center text-center"
                        >
                            <div className="relative w-40 h-40 flex items-center justify-center mb-4">
                                <svg viewBox="0 0 180 180" className="w-full h-full overflow-visible">
                                    <defs>
                                        <linearGradient id="lacquerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                            <stop offset="0%" stopColor="#b84a3e" />
                                            <stop offset="55%" stopColor="#8d2d24" />
                                            <stop offset="100%" stopColor="#5c1913" />
                                        </linearGradient>
                                        <linearGradient id="woodFaceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                            <stop offset="0%" stopColor="#d2ba95" />
                                            <stop offset="50%" stopColor="#efe0c4" />
                                            <stop offset="100%" stopColor="#c7ab80" />
                                        </linearGradient>
                                    </defs>
                                    {/* 喚醒漣漪光環 */}
                                    <g className="portal-halo-ring opacity-65">
                                        <circle cx="90" cy="94" r="58" fill="none" stroke="#c8a46b" strokeWidth="1" strokeDasharray="3 4" />
                                        <circle cx="90" cy="94" r="44" fill="rgba(223,193,141,0.14)" stroke="#c8a46b" strokeWidth="0.8" />
                                    </g>
                                    {/* 左瓣：立體硃砂紅漆凸面筊杯 */}
                                    <g className="portal-moon-left">
                                        <path d="M40 116 C36 78, 62 50, 92 54 C74 72, 68 96, 76 122 C60 125, 45 122, 40 116 Z" fill="#4e1510" transform="translate(0, 5)" />
                                        <path d="M40 116 C36 78, 62 50, 92 54 C74 72, 68 96, 76 122 C60 125, 45 122, 40 116 Z" fill="url(#lacquerGrad)" stroke="#e6cca0" strokeWidth="0.9" />
                                        <path d="M48 106 C47 82, 62 63, 80 61" fill="none" stroke="rgba(255,238,220,0.45)" strokeWidth="2.2" strokeLinecap="round" />
                                    </g>
                                    {/* 右瓣：立體溫潤原木平面筊杯（含立體側邊厚度） */}
                                    <g className="portal-moon-right">
                                        <path d="M140 116 C144 78, 118 50, 88 54 C106 72, 112 96, 104 122 C120 125, 135 122, 140 116 Z" fill="#8b2e25" transform="translate(0, 6)" />
                                        <path d="M140 116 C144 78, 118 50, 88 54 C106 72, 112 96, 104 122 C120 125, 135 122, 140 116 Z" fill="url(#woodFaceGrad)" stroke="#9e3d33" strokeWidth="1.4" />
                                    </g>
                                </svg>
                            </div>
                            <p className="font-latin text-[10px] tracking-[0.34em] text-theme-gold uppercase mb-1.5">
                                DIVINE RESPONSE
                            </p>
                            <h3 className="text-xl font-normal tracking-[0.28em] pl-[0.28em] text-theme-primary mb-2">
                                擲筊
                            </h3>
                            <p className="text-xs text-theme-secondary tracking-[0.12em] font-light leading-relaxed mb-4">
                                一陰一陽，俯仰之間。<br />誠心叩問明確的是非與應允。
                            </p>
                            <span className="text-[11px] tracking-[0.26em] text-theme-gold border-b border-[#b89254]/45 pb-0.5">
                                喚醒雙筊 →
                            </span>
                        </div>

                        {/* Portal B：三元牌 · Magical Oracle */}
                        <div
                            role="button"
                            tabIndex={0}
                            onClick={() => onSelectPortal('cards')}
                            onKeyDown={(e) => e.key === 'Enter' && onSelectPortal('cards')}
                            style={{ '--portal-aura': 'rgba(182, 166, 224, 0.38)' }}
                            className="portal-shrine px-6 pt-9 pb-7 flex flex-col items-center text-center"
                        >
                            <div className="relative w-40 h-40 flex items-center justify-center mb-4">
                                <svg viewBox="0 0 180 180" className="w-full h-full overflow-visible">
                                    {/* 旋轉魔法符文陣光環 */}
                                    <g className="portal-rune-wheel opacity-70">
                                        <circle cx="90" cy="92" r="62" fill="rgba(207,196,230,0.16)" stroke="#b89254" strokeWidth="0.9" />
                                        <circle cx="90" cy="92" r="54" fill="none" stroke="#9b8ec4" strokeWidth="0.8" strokeDasharray="4 3" />
                                        <polygon points="90,34 140,121 40,121" fill="none" stroke="#c8a46b" strokeWidth="0.8" strokeOpacity="0.6" />
                                        <polygon points="90,150 140,63 40,63" fill="none" stroke="#9b8ec4" strokeWidth="0.8" strokeOpacity="0.5" />
                                    </g>
                                    {/* 左右側翼牌陣 */}
                                    <g className="portal-side-card-l" transform="translate(-14, 4) rotate(-12 90 95)">
                                        <rect x="64" y="50" width="52" height="78" rx="6" fill="#232034" stroke="#c8a46b" strokeWidth="1.1" />
                                        <circle cx="90" cy="89" r="13" fill="none" stroke="#c8a46b" strokeWidth="0.7" />
                                    </g>
                                    <g className="portal-side-card-r" transform="translate(14, 4) rotate(12 90 95)">
                                        <rect x="64" y="50" width="52" height="78" rx="6" fill="#232034" stroke="#c8a46b" strokeWidth="1.1" />
                                        <circle cx="90" cy="89" r="13" fill="none" stroke="#c8a46b" strokeWidth="0.7" />
                                    </g>
                                    {/* 中央浮起召喚主牌 */}
                                    <g className="portal-hero-card">
                                        <rect x="61" y="44" width="58" height="86" rx="7" fill="#1a1829" stroke="#e5cfa3" strokeWidth="1.6" />
                                        <rect x="66" y="49" width="48" height="76" rx="4" fill="none" stroke="#cfc4e6" strokeWidth="0.75" />
                                        <circle cx="90" cy="87" r="17" fill="rgba(229,207,163,0.12)" stroke="#e5cfa3" strokeWidth="1" />
                                        <path d="M90 66 L94 83 L111 87 L94 91 L90 108 L86 91 L69 87 L86 83 Z" fill="#e5cfa3" />
                                    </g>
                                </svg>
                            </div>
                            <p className="font-latin text-[10px] tracking-[0.34em] text-theme-gold uppercase mb-1.5">
                                MAGICAL ORACLE
                            </p>
                            <h3 className="text-xl font-normal tracking-[0.28em] pl-[0.28em] text-theme-primary mb-2">
                                三元牌
                            </h3>
                            <p className="text-xs text-theme-secondary tracking-[0.12em] font-light leading-relaxed mb-4">
                                召喚星象魔卡，映照顯意識與潛意識的起源、連結與未來。
                            </p>
                            <span className="text-[11px] tracking-[0.26em] text-theme-gold border-b border-[#b89254]/45 pb-0.5">
                                啟動召喚 →
                            </span>
                        </div>

                        {/* Portal C：靈籤 · 宇宙指引 (Ancient Revelation) */}
                        <div
                            role="button"
                            tabIndex={0}
                            onClick={() => onSelectPortal('guide')}
                            onKeyDown={(e) => e.key === 'Enter' && onSelectPortal('guide')}
                            style={{ '--portal-aura': 'rgba(148, 184, 172, 0.38)' }}
                            className="portal-shrine px-6 pt-9 pb-7 flex flex-col items-center text-center"
                        >
                            <div className="relative w-40 h-40 flex items-center justify-center mb-4">
                                <svg viewBox="0 0 180 180" className="w-full h-full overflow-visible">
                                    {/* 背景古紙卷軸與天體封印環 */}
                                    <circle cx="90" cy="92" r="58" fill="rgba(154,184,173,0.14)" stroke="#b89254" strokeWidth="0.9" strokeDasharray="2 3" className="portal-halo-ring" />
                                    <g className="portal-scroll-sheet opacity-80">
                                        <rect x="44" y="54" width="92" height="44" rx="3" fill="#f7f1e3" stroke="#c8a46b" strokeWidth="1" />
                                        <rect x="40" y="51" width="5" height="50" rx="2" fill="#9a763c" />
                                        <rect x="135" y="51" width="5" height="50" rx="2" fill="#9a763c" />
                                    </g>
                                    {/* 後排竹籤束 */}

        // =====================================================================
        // 1. 擲筊元件 (MoonBlocks) — 嚴格保留原有隨機演算與結果判斷
        //    明暗轉換：待機空靈 → 擲筊漸暗聚光 (dusk) → 揭曉破曉回暖 (luminous)
        // =====================================================================
        const BLOCK_PHASE_LABELS = {
            IDLE: '',
            PREPARING: '合 掌 拜 筊 · 凝 神 聚 氣',
            THROWING: '誠 心 擲 出 問 卜',
            COLLISION: '青 石 落 地 回 響',
            SETTLING: '陰 陽 靈 機 落 定',
            REVEAL: '天 光 破 曉 揭 曉',
            RESULT: ''
        };

        const MoonBlocks = ({ selectedIntent }) => {
            const [phase, setPhase] = useState("IDLE");
            const [blocks, setBlocks] = useState([0, 0]);
            const [resultText, setResultText] = useState("");
            const [resultDesc, setResultDesc] = useState("");
            const [fallbackMode, setFallbackMode] = useState(false);

            const sessionRef = useRef(0);
            const fallbackTimerRef = useRef(null);
            const isBusy = phase !== "IDLE" && phase !== "RESULT";

            useEffect(() => {
                setStageSceneTone('ethereal');
                if (window.DivinationStage && !window.DivinationStage.isWebGLAvailable()) {
                    setFallbackMode(true);
                }
                return () => {
                    sessionRef.current++;
                    if (fallbackTimerRef.current) clearTimeout(fallbackTimerRef.current);
                    if (window.DivinationStage && typeof window.DivinationStage.resetMoonBlocks === 'function') {
                        window.DivinationStage.resetMoonBlocks();
                    }
                };
            }, []);

            const toss = () => {
                if (isBusy) return;

                const mySession = ++sessionRef.current;
                setPhase("PREPARING");
                setResultText("");
                setResultDesc("");
                // 儀式啟動：柔和轉暗凸顯光影與木筊質感
                setStageSceneTone('dusk');

                // 既有核心隨機演算與判斷邏輯（100% 原封保留，絕不更動）
                const b1 = Math.random() > 0.5 ? 1 : 0;
                const b2 = Math.random() > 0.5 ? 1 : 0;
                const sum = b1 + b2;
                let text = "";
                let desc = "";

                if (sum === 1) {
                    text = "聖筊";
                    desc = "所願可成，心誠則靈。";
                } else if (sum === 2) {
                    text = "笑筊";
                    desc = "機緣未定，或再三思。";
                } else {
                    text = "陰筊";
                    desc = "時機未到，靜候佳音。";
                }

                const onComplete = () => {
                    if (sessionRef.current !== mySession) return;
                    setBlocks([b1, b2]);
                    setResultText(text);
                    setResultDesc(desc);
                    setPhase("RESULT");
                    // 結果揭曉：回到溫暖明亮、具安定感的氛圍
                    setStageSceneTone('luminous');
                };

                const onPhaseChange = (nextPhase) => {
                    if (sessionRef.current !== mySession) return;
                    setPhase(nextPhase);
                    if (nextPhase === "REVEAL") {
                        setStageSceneTone('luminous');
                    }
                };

                const started3D =
                    window.DivinationStage &&
                    typeof window.DivinationStage.throwMoonBlocks === 'function' &&
                    window.DivinationStage.throwMoonBlocks(b1, b2, onComplete, onPhaseChange);

                if (!started3D) {
                    setFallbackMode(true);
                    fallbackTimerRef.current = setTimeout(() => {
                        if (sessionRef.current !== mySession) return;
                        setPhase("THROWING");
                        fallbackTimerRef.current = setTimeout(onComplete, 700);
                    }, 450);
                }
            };

            const resetBlocks = () => {
                sessionRef.current++;
                if (fallbackTimerRef.current) clearTimeout(fallbackTimerRef.current);
                setPhase("IDLE");
                setResultText("");
                setResultDesc("");
                setStageSceneTone('ethereal');
                if (window.DivinationStage && typeof window.DivinationStage.resetMoonBlocks === 'function') {
                    window.DivinationStage.resetMoonBlocks();
                }
            };

            const faceLabel = (val) => (val === 1 ? "陽 · 平面" : "陰 · 凸面");
            const resultToneClass =
                resultText === "聖筊"
                    ? "text-[#9a6e28]"
                    : resultText === "笑筊"
                    ? "text-[#4c6282]"

            return (
                <div

                >
                    <div className="text-center animate-ink-reveal">
                        <p className="font-latin text-[10px] md:text-xs tracking-[0.38em] text-theme-gold uppercase mb-1.5">
                            DIVINE RESPONSE · 擲 筊 問 卜
                        </p>
                        <p className="text-sm md:text-base text-theme-primary tracking-[0.22em] font-light">
                            {selectedIntent ? `默念「${selectedIntent.label}」所求之事` : '默念姓名與所求之事'}
                        </p>
                    </div>

                    <div className="flex-1 w-full min-h-[240px] md:min-h-[300px] flex items-center justify-center pointer-events-none">
                        {fallbackMode && (
                            <div className="flex gap-10 items-center">
                                {blocks.map((b, i) => (
                                    <div
                                        key={i}
                                        className={`w-20 h-10 rounded-b-full border transition-all duration-500 ${
                                            isBusy ? 'animate-bounce' : ''
                                        } ${
                                            b === 1
                                                ? 'bg-[#e5d2b0] border-[#963d33]'
                                                : 'bg-[#8f3228] border-[#c8a46b]/50'
                                        }`}
                                    />
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="w-full flex flex-col items-center">
                        <div className="min-h-[126px] flex items-center justify-center w-full mb-4">
                            {phase === "RESULT" && (
                                <div className="sanctuary-glass rounded-2xl px-8 py-5 text-center max-w-md w-full animate-ink-reveal">
                                    <div className="flex items-center justify-center gap-4 text-[11px] tracking-[0.2em] text-theme-secondary mb-1.5">
                                        <span>{faceLabel(blocks[0])}</span>
                                        <span className="text-theme-gold">✦</span>
                                        <span>{faceLabel(blocks[1])}</span>
                                    </div>
                                    <h2 className={`text-3xl md:text-4xl font-normal tracking-[0.35em] pl-[0.35em] mb-2 ${resultToneClass}`}>
                                        {resultText}
                                    </h2>
                                    <div className="gold-hairline w-20 mx-auto my-2.5"></div>
                                    <p className="text-theme-primary text-sm tracking-[0.18em] font-light">
                                        {resultDesc}
                                    </p>
                                </div>
                            )}

                            {isBusy && (
                                <div className="flex flex-col items-center gap-2.5">
                                    <p className="text-xs tracking-[0.36em] text-[#f0dab2] animate-pulse pl-[0.36em]">
                                        {BLOCK_PHASE_LABELS[phase] || '請 示 中'}
                                    </p>
                                    <div className="flex items-center gap-1.5">
                                        {['PREPARING', 'THROWING', 'COLLISION', 'SETTLING', 'REVEAL'].map((step) => (
                                            <span
                                                key={step}
                                                className={`h-1 rounded-full transition-all duration-300 ${
                                                    phase === step ? 'w-5 bg-[#f2dcb0]' : 'w-1.5 bg-[#c8a46b]/35'
                                                }`}
                                            />
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="flex items-center gap-3">
                            <button
                                onClick={toss}
                                disabled={isBusy}
                                className="ritual-btn ritual-btn-primary rounded-full py-3.5 text-sm font-normal outline-none"
                            >
                                {isBusy ? '請 示 中' : phase === 'RESULT' ? '再 次 擲 筊' : '誠 心 擲 筊'}
                            </button>
                            {phase === 'RESULT' && (
                                <button
                                    onClick={resetBlocks}
                                    className="ritual-btn rounded-full py-3.5 !px-6 text-xs font-normal outline-none"
                                >
                                    重置
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // =====================================================================
        // 2. 三元牌元件 (TriadCards) — Magical Card Summoning 六階段召喚儀式
        //    流程：MAGIC_CIRCLE → ENERGY_GATHERING → CARD_MATERIALIZATION → CARD_AWAKENING → CARD_REVEAL → RESULT
        //    嚴格保留既有雙階段選牌邏輯、6 張牌圖與 12 組完整詩文解讀
        // =====================================================================
        const SUMMON_PHASE_LABELS = {
            IDLE: '',
            SHUFFLING: '星 牌 佈 陣 中',
            SELECTING: '',

        // 每張牌專屬的原創召喚元素光色（僅影響召喚特效，絕不更動原牌圖與牌義）

        // 獨立宣告於 TriadCards 外部，確保狀態變更時 DOM 穩定不重建
        const InteractiveCard = ({ card, idx, orderList, isSelectingAllowed, onClick }) => {
            const index = orderList.indexOf(card.id);
            const selectIdx = index !== -1 ? index + 1 : null;
            const isReceded = orderList.length === 3 && !selectIdx;
            const theme = CARD_SUMMON_THEMES[card.id] || CARD_SUMMON_THEMES.origin;
            const cardRef = useRef(null);
            const [tilt, setTilt] = useState({ rx: 0, ry: 0 });

            const baseAngle = idx === 0 ? 7 : idx === 2 ? -7 : 0;
            const baseZ = idx === 1 ? 16 : -6;
            const floatDelay = `${idx * 0.85}s`;

            const onMouseMove = (e) => {
                if (!cardRef.current || !isSelectingAllowed) return;
                const rect = cardRef.current.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                setTilt({ rx: -y * 15, ry: x * 17 });
            };

            const onMouseLeave = () => setTilt({ rx: 0, ry: 0 });

            return (

                        ref={cardRef}
                        onClick={() => onClick(card.id)}
                        onMouseMove={onMouseMove}
                        onMouseLeave={onMouseLeave}
                        style={{
                            animationDelay: floatDelay,
                            '--card-element-color': theme.color,
                            '--card-element-glow': theme.glow,

        const TriadCards = () => {
