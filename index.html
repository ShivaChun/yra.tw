<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靈感問路站 | 擲筊・三元牌・指引</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap'); /* For Latin Card Names */
        
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #f4f4f0;
            color: #4a4a4a;
            overflow-x: hidden; /* Prevent horizontal scroll on body */
        }

        /* --- Animations --- */
        @keyframes toss {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-50px) rotate(180deg); }
            50% { transform: translateY(0) rotate(360deg); }
            75% { transform: translateY(-20px) rotate(540deg); }
            100% { transform: translateY(0) rotate(720deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardReveal {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes float-card {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @keyframes float-particle {
            0% { transform: translateY(0px) translateX(0px); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100px) translateX(20px); opacity: 0; }
        }

        .animate-toss { animation: toss 0.8s ease-in-out; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .animate-card-reveal { animation: cardReveal 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .animate-float { animation: float-card 6s ease-in-out infinite; }
        
        /* Moon Block Styles */
        .moon-block {
            width: 80px;
            height: 40px;
            border-radius: 2px 2px 40px 40px;
            transition: all 0.5s ease;
            position: relative;
        }
        
        .block-round {
            background-color: #a05248;
            box-shadow: inset 0 -4px 8px rgba(0,0,0,0.1);
            transform: rotateX(0deg); 
        }

        .block-flat {
            background-color: #dcd0c0;
            border: 2px solid #a05248;
            transform: rotateX(180deg); 
        }

        /* Particle Styles */
        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(1px);
        }

        .nav-active {
            color: #595959;
            border-bottom: 1px solid #595959;
        }
        
        .nav-item {
            color: #a0a0a0;
            transition: all 0.3s;
        }
        
        .nav-item:hover {
            color: #707070;
        }

        .font-latin {
            font-family: 'Cinzel', serif;
        }
        
        /* Card Selection Number Badge */
        .selection-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 36px;
            height: 36px;
            background-color: #a05248;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease-out;
            z-index: 20;
            border: 2px solid rgba(255,255,255,0.2);
        }

        /* Hide Scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Icons
        const Icons = {
            Moon: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>,
            Cards: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M8 2v20"/><path d="M20 12h-8"/><path d="M4 12h-2"/></svg>,
            Compass: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        };

        // --- Components ---

        // 1. Moon Blocks
        const MoonBlocks = () => {
            const [status, setStatus] = useState("ready"); 
            const [blocks, setBlocks] = useState([0, 0]); 
            const [resultText, setResultText] = useState("");
            const [resultDesc, setResultDesc] = useState("");

            const toss = () => {
                if (status === "tossing") return;
                setStatus("tossing");
                setResultText("");
                setResultDesc("");

                setTimeout(() => {
                    const b1 = Math.random() > 0.5 ? 1 : 0;
                    const b2 = Math.random() > 0.5 ? 1 : 0;
                    setBlocks([b1, b2]);
                    
                    const sum = b1 + b2;
                    let text = "";
                    let desc = "";

                    if (sum === 1) {
                        text = "聖筊";
                        desc = "所願可成，心誠則靈。";
                    } else if (sum === 2) {
                        text = "笑筊";
                        desc = "機緣未定，或再三思。";
                    } else {
                        text = "陰筊";
                        desc = "時機未到，靜候佳音。";
                    }

                    setResultText(text);
                    setResultDesc(desc);
                    setStatus("result");
                }, 800);
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-[500px] font-serif bg-[#f4f4f0]">
                    <div className="mb-12 text-center">
                        <p className="text-[#888] text-sm tracking-widest mb-2 font-light">HEART SINCERITY</p>
                        <p className="text-[#555] tracking-widest">默念姓名與所求之事</p>
                    </div>

                    <div className="flex gap-10 mb-12 h-24 items-center">
                        <div className={`moon-block ${status === 'tossing' ? 'animate-toss' : ''} ${blocks[0] === 1 ? 'block-flat' : 'block-round'}`}></div>
                        <div className={`moon-block ${status === 'tossing' ? 'animate-toss' : ''} ${blocks[1] === 1 ? 'block-flat' : 'block-round'}`}></div>
                    </div>

                    {status === "result" && (
                        <div className="text-center animate-fade-in mb-8">
                            <h2 className="text-3xl font-light text-[#a05248] mb-2 tracking-[0.2em]">{resultText}</h2>
                            <div className="w-8 h-[1px] bg-[#dcd0c0] mx-auto my-3"></div>
                            <p className="text-[#777] text-sm tracking-wider">{resultDesc}</p>
                        </div>
                    )}

                    <button 
                        onClick={toss}
                        disabled={status === 'tossing'}
                        className="bg-[#6b6b6b] hover:bg-[#555] text-[#f4f4f0] text-sm tracking-widest py-3 px-10 transition-colors duration-500 disabled:opacity-50 disabled:cursor-not-allowed outline-none rounded-sm"
                    >
                        {status === 'tossing' ? '...' : '擲 筊'}
                    </button>
                </div>
            );
        };

        // 2. Triad Cards (三元牌) - Mysterious Floating Space
        const TriadCards = () => {
            const [stage, setStage] = useState('main-select'); 
            const [mainOrder, setMainOrder] = useState([]); 
            const [subOrder, setSubOrder] = useState([]);
            const [particles, setParticles] = useState([]);

            const mainCardsData = [
                { 
                    id: 'origin', 
                    title: 'Origo Animae', 
                    deTitle: 'Ursprung der Seele',
                    phrase: 'Aus der Wurzel steigt das Licht',
                    img: 'https://img.yra.tw/x/Origo%20Animae-2.png' 
                },
                { 
                    id: 'bond', 
                    title: 'Transmutatio Vinculi', 
                    deTitle: 'Wandel der Verbindung',
                    phrase: 'Im Band fließt das Leben',
                    img: 'https://img.yra.tw/x/Transmutatio%20Vinculi-2.png' 
                },
                { 
                    id: 'future', 
                    title: 'Realis Futura', 
                    deTitle: 'Verwirklichung der Zukunft',
                    phrase: 'Feuer führt zu den Sternen',
                    img: 'https://img.yra.tw/x/Reakis%20Futura-2.png'
                }
            ];

            const subCardsData = [
                { id: 'arbor', title: 'Arbor', img: 'https://img.yra.tw/x/Arbor-1.png' },
                { id: 'astra', title: 'ASTRA', img: 'https://img.yra.tw/x/ASTRA-2.png' },
                { id: 'semen', title: 'Semen', img: 'https://img.yra.tw/x/Semen02.png' }
            ];

            // Initialize cosmic particles for background
            useEffect(() => {
                const newParticles = [];
                for(let i=0; i<40; i++){
                    newParticles.push({
                        id: i,
                        top: Math.random() * 100 + '%',
                        left: Math.random() * 100 + '%',
                        size: Math.random() * 2 + 'px',
                        duration: Math.random() * 5 + 5 + 's',
                        delay: Math.random() * 5 + 's'
                    });
                }
                setParticles(newParticles);
            }, []);

            const handleMainClick = (id) => {
                if (stage !== 'main-select') return;
                if (mainOrder.includes(id)) {
                    setMainOrder(mainOrder.filter(item => item !== id));
                } else {
                    if (mainOrder.length < 3) {
                        setMainOrder([...mainOrder, id]);
                    }
                }
            };

            const handleSubClick = (id) => {
                if (stage !== 'sub-select') return;
                if (subOrder.includes(id)) {
                    setSubOrder(subOrder.filter(item => item !== id));
                } else {
                    if (subOrder.length < 3) {
                        setSubOrder([...subOrder, id]);
                    }
                }
            };

            const getSelectionIndex = (id, list) => {
                const index = list.indexOf(id);
                return index !== -1 ? index + 1 : null;
            };

            const getCard = (id, list) => list.find(c => c.id === id);

            // Carousel Card Component
            const CardItem = ({ card, orderList, onClick, isSelectable }) => {
                const selectIdx = getSelectionIndex(card.id, orderList);
                // Float animation delay based on id char code to desync
                const floatDelay = `${card.id.charCodeAt(0) % 5}s`;

                return (
                    <div className="snap-center shrink-0 w-[75vw] sm:w-[320px] md:w-[280px] flex flex-col items-center justify-center p-4">
                        <div 
                            onClick={() => isSelectable && onClick(card.id)}
                            className={`
                                relative w-full aspect-[2/3] rounded-xl overflow-hidden shadow-2xl 
                                transition-all duration-500 ease-out cursor-pointer
                                ${isSelectable ? 'animate-float' : ''}
                                ${selectIdx ? 'ring-2 ring-[#a05248] scale-95 opacity-60' : 'hover:scale-105 hover:z-10'}
                            `}
                            style={{ animationDelay: floatDelay }}
                        >
                            <img src={card.img} alt="card" className="w-full h-full object-cover pointer-events-none select-none" />
                            
                            {/* Overlay Gradient for depth */}
                            <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-60"></div>

                            {selectIdx && (
                                <div className="selection-badge">{selectIdx}</div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="relative flex flex-col items-center min-h-[600px] w-full animate-fade-in overflow-hidden rounded-xl">
                    
                    {/* Cosmic Background */}
                    <div className="absolute inset-0 bg-[#0a0a0c] z-0">
                         <div className="absolute inset-0 bg-gradient-to-b from-[#1a1a2e] to-[#0a0a0c] opacity-80"></div>
                         {particles.map(p => (
                            <div key={p.id} className="particle opacity-30" style={{
                                top: p.top, 
                                left: p.left, 
                                width: p.size, 
                                height: p.size,
                                animation: `float-particle ${p.duration} ease-in-out infinite`,
                                animationDelay: p.delay
                            }}></div>
                        ))}
                    </div>

                    {/* Content Layer */}
                    <div className="relative z-10 w-full flex flex-col h-full py-8">
                        
                        {/* Header */}
                        <div className="text-center mb-4 px-4">
                            <p className="text-[#888] text-[10px] md:text-xs font-latin tracking-[0.3em] mb-2 uppercase opacity-70">
                                {stage.includes('main') ? 'Phase I : Origin' : 'Phase II : Subconscious'}
                            </p>
                            <h2 className="text-lg md:text-xl font-light text-[#e0e0e0] tracking-widest min-h-[3rem] drop-shadow-lg">
                                {stage === 'main-select' && "左右滑動瀏覽，點擊卡牌決定順序"}
                                {stage === 'main-reveal' && "三元顯現：連結、起源與未來"}
                                {stage === 'sub-select' && "凝視虛空，再次排序你的直覺"}
                                {stage === 'final-reveal' && "命運之流：完整的指引"}
                            </h2>
                        </div>

                        {/* STAGE: SELECTION (Carousel) */}
                        {(stage === 'main-select' || stage === 'sub-select') && (
                            <div className="flex-1 flex flex-col items-center justify-center w-full">
                                {/* Horizontal Scroll Container */}
                                <div className="w-full flex overflow-x-auto snap-x snap-mandatory gap-4 px-[12.5vw] sm:px-[calc(50%-160px)] md:px-[calc(50%-140px)] py-10 no-scrollbar items-center">
                                    {(stage === 'main-select' ? mainCardsData : subCardsData).map((card) => (
                                        <CardItem 
                                            key={card.id} 
                                            card={card} 
                                            orderList={stage === 'main-select' ? mainOrder : subOrder}
                                            onClick={stage === 'main-select' ? handleMainClick : handleSubClick}
                                            isSelectable={true}
                                        />
                                    ))}
                                    {/* Spacer for end of scroll */}
                                    <div className="w-[1px] shrink-0"></div> 
                                </div>

                                {/* Instruction Hint */}
                                <div className="mt-2 text-[#666] text-xs tracking-widest animate-pulse">
                                    ← SWIPE TO BROWSE →
                                </div>

                                {/* Action Button */}
                                <div className="mt-8 h-12">
                                    {(stage === 'main-select' ? mainOrder : subOrder).length === 3 && (
                                        <button 
                                            onClick={stage === 'main-select' ? () => setStage('main-reveal') : () => setStage('final-reveal')}
                                            className="px-10 py-3 bg-[#a05248] text-white rounded-full text-sm tracking-[0.2em] shadow-[0_0_20px_rgba(160,82,72,0.4)] hover:bg-[#b06258] transition-all transform hover:scale-105"
                                        >
                                            {stage === 'main-select' ? '確認顯現' : '揭示全貌'}
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* STAGE: REVEAL (Grid Layout) */}
                        {(stage === 'main-reveal' || stage === 'final-reveal') && (
                            <div className="flex-1 flex flex-col items-center w-full px-4">
                                
                                {/* If Final, maybe show Main small at top? */}
                                {stage === 'final-reveal' && (
                                     <div className="flex justify-center gap-2 mb-8 opacity-50">
                                         {mainOrder.map(id => (
                                             <div key={id} className="w-8 h-12 rounded bg-gray-700 overflow-hidden">
                                                 <img src={getCard(id, mainCardsData).img} className="w-full h-full object-cover" />
                                             </div>
                                         ))}
                                     </div>
                                )}

                                <div className="grid grid-cols-3 gap-3 md:gap-8 w-full max-w-4xl mt-4">
                                    {(stage === 'main-reveal' ? mainOrder : subOrder).map((id, index) => {
                                        const list = stage === 'main-reveal' ? mainCardsData : subCardsData;
                                        const card = getCard(id, list);
                                        return (
                                            <div key={id} className="flex flex-col items-center animate-card-reveal" style={{ animationDelay: `${index * 0.2}s` }}>
                                                <div className="relative mb-6 w-full aspect-[2/3] shadow-[0_0_30px_rgba(0,0,0,0.5)] rounded-lg overflow-hidden border border-white/10 group">
                                                    <img src={card.img} alt={card.title} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                                                    <div className="selection-badge text-sm !w-8 !h-8">{index + 1}</div>
                                                </div>
                                                <div className="text-center opacity-0 animate-fade-in" style={{ animationDelay: `${index * 0.2 + 0.5}s`, animationFillMode: 'forwards' }}>
                                                    <h3 className="font-latin text-xs md:text-sm font-bold text-[#d4a373] mb-1">{card.title}</h3>
                                                    {card.deTitle && <p className="font-latin text-[10px] md:text-xs text-[#aaa] tracking-wide mb-2">{card.deTitle}</p>}
                                                    {card.phrase && <p className="text-xs text-[#888] italic tracking-widest border-t border-white/10 pt-2 mt-2 px-1 leading-relaxed">"{card.phrase}"</p>}
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>

                                <div className="mt-12">
                                    {stage === 'main-reveal' ? (
                                        <button onClick={() => setStage('sub-select')} className="px-8 py-2 border border-[#d4a373] text-[#d4a373] rounded-sm text-xs tracking-[0.2em] hover:bg-[#d4a373] hover:text-black transition-colors uppercase">
                                            Phase II : Deep Dive
                                        </button>
                                    ) : (
                                        <button onClick={() => { setStage('main-select'); setMainOrder([]); setSubOrder([]); }} className="px-8 py-2 text-[#666] rounded-full text-xs tracking-widest hover:text-[#bbb] transition-colors">
                                            重置儀式
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 3. Random Guide (Cosmic Mystery Style)
        const RandomGuide = () => {
            const [status, setStatus] = useState("ready");
            const [guide, setGuide] = useState("");
            const [particles, setParticles] = useState([]);
            
            const guides = [
                "衝了，不要猶豫", "現在不是時候", "問問長輩的意見", "睡一覺再決定",
                "相信你的直覺", "這是一個轉機", "保持現狀", "大膽嘗試新方法",
                "先去吃頓好吃的", "放棄也是一種選擇", "有人正在等你開口", "再堅持一下",
                "換個角度想", "答案就在你心裡", "小心細節", "大吉大利，去做吧"
            ];

            useEffect(() => {
                const newParticles = [];
                for(let i=0; i<30; i++){
                    newParticles.push({
                        id: i,
                        top: Math.random() * 100 + '%',
                        left: Math.random() * 100 + '%',
                        size: Math.random() * 3 + 1 + 'px',
                        duration: Math.random() * 3 + 2 + 's',
                        delay: Math.random() * 2 + 's'
                    });
                }
                setParticles(newParticles);
            }, []);

            const getGuide = () => {
                setStatus("thinking");
                
                let count = 0;
                const interval = setInterval(() => {
                    setGuide(guides[Math.floor(Math.random() * guides.length)]);
                    count++;
                    if(count > 15) { 
                        clearInterval(interval);
                        setStatus("result");
                    }
                }, 80);
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-[500px] relative overflow-hidden rounded-xl">
                    <div className="absolute inset-0 bg-gradient-to-b from-[#0f0c29] via-[#302b63] to-[#24243e] z-0"></div>
                    
                    {particles.map(p => (
                        <div key={p.id} className="particle" style={{
                            top: p.top, 
                            left: p.left, 
                            width: p.size, 
                            height: p.size,
                            animation: `float-particle ${p.duration} ease-in-out infinite`,
                            animationDelay: p.delay
                        }}></div>
                    ))}

                    <div className="mb-10 text-center relative z-10">
                        <p className="text-indigo-200 text-sm tracking-widest opacity-80">COSMIC GUIDANCE</p>
                        <p className="text-white text-lg tracking-wider font-light mt-1">宇宙指引</p>
                    </div>

                    <div className="relative mb-12 group z-10">
                        <div className="w-56 h-56 rounded-full flex items-center justify-center relative backdrop-blur-sm border border-indigo-400/30 shadow-[0_0_50px_rgba(76,29,149,0.5)] transition-all duration-1000">
                             <div className="absolute inset-0 rounded-full bg-gradient-to-tr from-indigo-900/50 to-purple-500/10"></div>
                             
                             <div className="text-center px-6 relative">
                                {status === 'ready' && (
                                    <span className="text-indigo-200 text-7xl opacity-20 font-thin animate-pulse">?</span>
                                )}
                                {status !== 'ready' && (
                                    <p className={`text-2xl font-bold text-white leading-relaxed drop-shadow-[0_0_10px_rgba(255,255,255,0.8)] tracking-wider ${status === 'thinking' ? 'opacity-50' : 'animate-fade-in'}`}>
                                        {guide}
                                    </p>
                                )}
                            </div>
                        </div>
                        <div className="absolute -inset-4 border border-indigo-300/10 rounded-full animate-[spin_10s_linear_infinite]"></div>
                        <div className="absolute -inset-8 border border-purple-300/5 rounded-full animate-[spin_15s_linear_infinite_reverse]"></div>
                    </div>

                    <button 
                        onClick={getGuide}
                        disabled={status === 'thinking'}
                        className="relative z-10 bg-indigo-500/20 hover:bg-indigo-500/40 border border-indigo-400/50 text-indigo-100 py-3 px-10 rounded-full backdrop-blur-md transition-all duration-300 hover:shadow-[0_0_20px_rgba(99,102,241,0.4)] disabled:opacity-30 tracking-widest text-sm"
                    >
                        {status === 'thinking' ? '接收訊號中...' : '感應宇宙'}
                    </button>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState("blocks"); 

            // Dynamic header style based on tab
            const getHeaderStyle = () => {
                if (activeTab === 'guide') return "bg-[#0f0c29] text-indigo-100 border-b border-indigo-900";
                if (activeTab === 'cards') return "bg-[#0a0a0c] text-[#e0e0e0] border-b border-gray-800"; // Dark header for Cards
                return "bg-[#f4f4f0] text-[#555]"; 
            };

            return (
                <div className="max-w-2xl mx-auto min-h-screen bg-[#f4f4f0] shadow-2xl relative font-sans transition-colors duration-500">
                    
                    {/* Header: Adapts to style */}
                    <header className={`p-6 text-center transition-colors duration-500 relative overflow-hidden ${getHeaderStyle()}`}>
                        <div className="relative z-10">
                            <h1 className="text-2xl font-medium tracking-[0.3em] mb-1 font-serif">靈感問路站</h1>
                            <p className="text-[10px] opacity-60 tracking-[0.2em] uppercase font-sans">Divination & Guidance</p>
                        </div>
                    </header>

                    {/* Minimalist Navigation */}
                    <nav className="flex justify-around bg-[#fcfcfc] border-b border-[#eaeaea] sticky top-0 z-20">
                        <button 
                            onClick={() => setActiveTab('blocks')}
                            className={`flex flex-col items-center p-4 w-1/3 transition-all duration-300 text-xs tracking-widest ${activeTab === 'blocks' ? 'nav-active' : 'nav-item'}`}
                        >
                            <Icons.Moon />
                            <span className="mt-2">擲筊</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('cards')}
                            className={`flex flex-col items-center p-4 w-1/3 transition-all duration-300 text-xs tracking-widest ${activeTab === 'cards' ? 'nav-active' : 'nav-item'}`}
                        >
                            <Icons.Cards />
                            <span className="mt-2">三元牌</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('guide')}
                            className={`flex flex-col items-center p-4 w-1/3 transition-all duration-300 text-xs tracking-widest ${activeTab === 'guide' ? 'nav-active' : 'nav-item'}`}
                        >
                            <Icons.Compass />
                            <span className="mt-2">指引</span>
                        </button>
                    </nav>

                    {/* Main Content Area */}
                    <main className="p-4 sm:p-8">
                        <div className="bg-white rounded-lg shadow-[0_5px_30px_rgba(0,0,0,0.03)] overflow-hidden transition-all duration-500">
                            {activeTab === 'blocks' && <MoonBlocks />}
                            {activeTab === 'cards' && <TriadCards />}
                            {activeTab === 'guide' && <RandomGuide />}
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="text-center p-8 text-[#a0a0a0] text-xs font-light tracking-widest">
                        <p>心誠則靈 · 僅供參考</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
