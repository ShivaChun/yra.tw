<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CELESTIAL GATE — Cosmic Revelation Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060914;
      color: #f4ecdc;
      font-family: 'Noto Serif TC', serif;
    }
    #proto-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .hud-top {
      position: fixed;
      top: 22px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }
    .title-block h1 {
      font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
      font-size: 1.35rem;
      letter-spacing: 0.22em;
      color: #f6e4bc;
      font-weight: 600;
    }
    .title-block p {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      color: rgba(214, 228, 248, 0.76);
      margin-top: 4px;
    }
    .metrics {
      background: rgba(10, 16, 32, 0.72);
      border: 1px solid rgba(212, 180, 124, 0.35);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      color: #e6d4b0;
      backdrop-filter: blur(10px);
    }
    .hud-bottom {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
      width: min(94vw, 980px);
    }
    .play-btn {
      cursor: pointer;
      padding: 11px 32px;
      border-radius: 999px;
      border: 1px solid rgba(244, 222, 176, 0.65);
      background: linear-gradient(135deg, rgba(28, 46, 88, 0.85), rgba(16, 24, 48, 0.92));
      color: #fff3d6;
      font-family: 'Noto Serif TC', serif;
      font-size: 0.92rem;
      letter-spacing: 0.26em;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), 0 0 22px rgba(110, 205, 255, 0.24);
      transition: all 0.25s ease;
    }
    .play-btn:hover {
      border-color: #fff5dc;
      transform: translateY(-1px);
    }
    .stage-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      background: rgba(8, 13, 26, 0.76);
      border: 1px solid rgba(165, 198, 235, 0.24);
      border-radius: 18px;
      padding: 8px 12px;
      backdrop-filter: blur(12px);
    }
    .stage-chip {
      cursor: pointer;
      border: 1px solid rgba(212, 180, 124, 0.24);
      background: rgba(18, 27, 49, 0.65);
      color: rgba(232, 238, 248, 0.8);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      transition: all 0.2s ease;
    }
    .stage-chip.active, .stage-chip:hover {
      background: rgba(212, 180, 124, 0.24);
      border-color: rgba(246, 226, 182, 0.8);
      color: #fff6df;
    }
  </style>
</head>
<body>
  <canvas id="proto-canvas"></canvas>

  <div class="hud-top">
    <div class="title-block">
      <h1>CELESTIAL GATE — COSMIC REVELATION</h1>
      <p id="stage-subtitle">STAGE: THE_VOID · 星空與深邃宇宙空間</p>
    </div>
    <div class="metrics" id="fps-badge">FPS: 60</div>
  </div>

  <div class="hud-bottom">
    <button class="play-btn" id="btn-play-all">啟動完整七階段宇宙指引動畫</button>
    <div class="stage-bar" id="stage-bar">
      <button class="stage-chip active" data-stage="THE_VOID">1. THE VOID</button>
      <button class="stage-chip" data-stage="AWAKENING">2. AWAKENING</button>
      <button class="stage-chip" data-stage="PORTAL_OPENING">3. PORTAL OPENING</button>
      <button class="stage-chip" data-stage="CELESTIAL_ALIGNMENT">4. CELESTIAL ALIGNMENT</button>
      <button class="stage-chip" data-stage="ENERGY_SYNCHRONIZATION">5. ENERGY SYNC</button>
      <button class="stage-chip" data-stage="SEAL_BREAKING">6. SEAL BREAKING</button>
      <button class="stage-chip" data-stage="DIVINE_REVELATION">7. DIVINE REVELATION</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { CelestialGateScene, CELESTIAL_GATE_PHASES } from './js/celestial-gate-3d.js';

    const STAGE_LABELS = {
      THE_VOID: 'THE_VOID · 星空與深邃的宇宙空間',
      AWAKENING: 'AWAKENING · 能量煙霧聚集，中央入口逐漸形成',
      PORTAL_OPENING: 'PORTAL_OPENING · 中央時空入口打開，煙霧沿邊界渦旋流動',
      CELESTIAL_ALIGNMENT: 'CELESTIAL_ALIGNMENT · 多層星體軌道依序展開、旋轉與星座定位',
      ENERGY_SYNCHRONIZATION: 'ENERGY_SYNCHRONIZATION · 星體軌道共鳴，能量向中央核心匯聚',
      SEAL_BREAKING: 'SEAL_BREAKING · 紫藍空間裂縫破封，能量向外擴散爆發',
      DIVINE_REVELATION: 'DIVINE_REVELATION · 中央垂直光柱貫穿星軌，煙霧化為上升星塵',
      GUIDANCE: 'GUIDANCE · 儀式完成回暖，守護指引卷軸'
    };

    const canvas = document.getElementById('proto-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#050814');

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 0.48, 6.45);
    const currentLook = new THREE.Vector3(0, 0.08, 0);

    scene.add(new THREE.AmbientLight(0xdce8ff, 0.9));

    const gate = new CelestialGateScene();
    gate.group.visible = true;
    scene.add(gate.group);

    let shake = 0;
    gate.setImpactHandler((amt) => { shake = Math.max(shake, amt); });

    const subtitleEl = document.getElementById('stage-subtitle');
    const chips = Array.from(document.querySelectorAll('.stage-chip'));

    function syncActiveChip(stage) {
      subtitleEl.textContent = `STAGE: ${STAGE_LABELS[stage] || stage}`;
      chips.forEach((c) => c.classList.toggle('active', c.dataset.stage === stage));
    }

    chips.forEach((chip) => {
      chip.addEventListener('click', () => {
        const st = chip.dataset.stage;
        scene.background.set('#050814');
        gate.previewStage(st);
        syncActiveChip(st);
      });
    });

    document.getElementById('btn-play-all').addEventListener('click', () => {
      scene.background.set('#050814');
      gate.reset();
      gate.invokeOracle(
        1,
        () => {
          syncActiveChip('GUIDANCE');
        },
        (phase) => {
          syncActiveChip(phase);
        }
      );
    });

    window.celestialProto = { gate, syncActiveChip, scene };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    let frames = 0;
    let fpsAccum = 0;
    const fpsBadge = document.getElementById('fps-badge');

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      gate.update(dt);

      const camTarget = gate.getCameraTarget();
      const aspect = window.innerWidth / Math.max(1, window.innerHeight);
      const distScale = aspect < 1.0 ? Math.min(2.85, Math.max(1.24, 1.28 / aspect)) : 1.0;

      const desired = new THREE.Vector3(...camTarget.pos);
      const look = new THREE.Vector3(...camTarget.lookAt);
      if (distScale > 1.0) {
        desired.copy(look).add(desired.clone().sub(look).multiplyScalar(distScale));
      }

      camera.position.lerp(desired, Math.min(1, dt * 1.35));
      currentLook.lerp(look, Math.min(1, dt * 1.65));

      if (shake > 0.001) {
        camera.position.x += (Math.random() - 0.5) * 2 * shake;
        camera.position.y += (Math.random() - 0.5) * 2 * shake;
        shake *= Math.pow(0.006, dt);
      }
      camera.lookAt(currentLook);

      // 保持一致的深邃宇宙夜空氛圍，不跳回米白底色
      renderer.render(scene, camera);

      frames++;
      fpsAccum += dt;
      if (fpsAccum >= 0.5) {
        fpsBadge.textContent = `FPS: ${Math.round(frames / fpsAccum)}`;
        frames = 0;
        fpsAccum = 0;
      }
    }
    animate();
  </script>
</body>
</html>
